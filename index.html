<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE9DC">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>陽寶的英文小島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
:root {
  --sky: #FFE9DC;        /* 蜜桃底 */
  --paper: #FFFBF6;      /* 卡片 */
  --ink: #5B3B31;        /* 可可色字 */
  --ink-soft: #9A7568;
  --cocoa-light: #B07A5A;
  --cocoa: #85563E;
  --cream: #F7E4CF;
  --pink: #FF8FAB;
  --pink-deep: #E86A8A;
  --mint: #7FD6C2;
  --mint-deep: #4DB59D;
  --water: #A9E3F0;
  --water-deep: #6CC4DA;
  --butter: #FFD45E;
  --butter-deep: #E8B530;
  --lilac: #C9B6F2;
  --line: #F1D9CB;
  --font-en: "Fredoka", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  --font-zh: "LXGW WenKai TC", "jf-openhuninn", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --font-emoji: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-zh);
  font-size: 20px;
  line-height: 1.5;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}
body::after { /* 底部的小波浪 */
  content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 90px; z-index: 0; pointer-events: none;
  background:
    radial-gradient(40px 22px at 40px 0, transparent 98%, var(--water) 100%) 0 0/80px 40px repeat-x,
    linear-gradient(var(--water), var(--water)) 0 40px/100% 50px no-repeat;
  opacity: .55;
}
.en { font-family: var(--font-en); }
.emo { font-family: var(--font-emoji); font-style: normal; }
#app {
  position: relative; z-index: 1;
  max-width: 860px; margin: 0 auto;
  min-height: 100%;
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 100px);
  display: flex; flex-direction: column; gap: 16px;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--water-deep); outline-offset: 3px; }

/* ---------- 按鈕 ---------- */
.btn {
  --bg: var(--pink); --edge: var(--pink-deep); --fg: #fff;
  min-height: 64px; padding: 10px 28px; border-radius: 24px;
  background: var(--bg); color: var(--fg);
  box-shadow: 0 6px 0 var(--edge);
  font-family: var(--font-zh); font-size: 26px; font-weight: 700; letter-spacing: .04em;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--edge); }
.btn.mint { --bg: var(--mint); --edge: var(--mint-deep); }
.btn.butter { --bg: var(--butter); --edge: var(--butter-deep); --fg: var(--ink); }
.btn.soft { --bg: #fff; --edge: var(--line); --fg: var(--ink); }
.btn.big { min-height: 84px; font-size: 32px; padding-inline: 44px; border-radius: 30px; }
.btn.small { min-height: 52px; font-size: 20px; padding-inline: 18px; border-radius: 18px; box-shadow: 0 4px 0 var(--edge); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn {
  width: 60px; height: 60px; border-radius: 50%;
  background: #fff; box-shadow: 0 4px 0 var(--line);
  display: inline-grid; place-items: center; font-size: 28px; flex: none;
}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* ---------- 頂列 ---------- */
.topbar { display: flex; align-items: center; gap: 12px; }
.river {
  position: relative; flex: 1; height: 26px; border-radius: 13px;
  background: #fff; box-shadow: inset 0 0 0 3px var(--line); overflow: visible;
}
.river-fill {
  position: absolute; inset: 3px auto 3px 3px; border-radius: 10px;
  background: repeating-linear-gradient(-45deg, var(--water) 0 10px, #BDEBF4 10px 20px);
  width: 0; transition: width 1s linear;
}
.river-lamb {
  position: absolute; top: 50%; left: 0; width: 48px; height: 48px;
  transform: translate(-50%, -54%); transition: left 1s linear;
}
.star-count {
  flex: none; display: flex; align-items: center; gap: 4px;
  background: #fff; border-radius: 20px; padding: 6px 14px; box-shadow: 0 4px 0 var(--line);
  font-family: var(--font-en); font-weight: 600; font-size: 24px;
}

/* ---------- 卡片 ---------- */
.card {
  background: var(--paper); border-radius: 32px; padding: 28px 24px;
  box-shadow: 0 10px 0 var(--line), 0 18px 40px rgba(176, 122, 90, .12);
  display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
}
@media (max-height: 860px) and (orientation: landscape) {
  .card { padding-block: 18px; gap: 10px; }
  .emoji-big { font-size: 64px; }
  .mic { width: 104px; height: 104px; font-size: 44px; }
}
.prompt { font-size: 24px; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; }
.prompt .tag {
  font-size: 18px; padding: 2px 12px; border-radius: 12px; background: var(--cream); color: var(--cocoa);
}
.word { font-family: var(--font-en); font-weight: 600; font-size: clamp(44px, 9vw, 72px); line-height: 1.1; color: var(--ink); overflow-wrap: anywhere; }
.gloss { font-size: 30px; font-weight: 700; color: var(--cocoa); }
.emoji-big { font-family: var(--font-emoji); font-size: 84px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.06)); }
.sentence { font-family: var(--font-en); font-size: clamp(24px, 4.2vw, 32px); line-height: 1.45; max-width: 30ch; }
.sentence mark { background: linear-gradient(transparent 55%, #FFE07A 55%); color: inherit; padding: 0 2px; border-radius: 4px; }
.zh { font-size: 24px; color: var(--ink-soft); }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }

/* 選擇題 */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.choices.one { grid-template-columns: 1fr; }
@media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
.choice {
  min-height: 76px; padding: 12px 16px; border-radius: 22px;
  background: #fff; box-shadow: 0 6px 0 var(--line), inset 0 0 0 3px var(--line);
  font-size: 26px; font-weight: 700; line-height: 1.3;
  transition: transform .08s, opacity .3s, background .2s;
}
.choice.en { font-family: var(--font-en); font-weight: 500; font-size: 30px; }
.choice.long { font-size: 22px; font-weight: 400; text-align: left; }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line), inset 0 0 0 3px var(--line); }
.choice.right { background: #E2F8F1; box-shadow: 0 6px 0 var(--mint-deep), inset 0 0 0 3px var(--mint); }
.choice.tried { opacity: .38; pointer-events: none; }
.choice.glow { animation: glow 1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 6px 0 var(--butter-deep), inset 0 0 0 4px var(--butter); } }

/* 拼字 */
.slots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.slot {
  width: 54px; height: 64px; border-radius: 16px; background: #fff;
  box-shadow: inset 0 0 0 3px var(--line); display: grid; place-items: center;
  font-family: var(--font-en); font-weight: 600; font-size: 36px;
}
.slot.filled { box-shadow: inset 0 0 0 3px var(--water-deep); background: #EEFAFD; }
.slot.locked { box-shadow: inset 0 0 0 3px var(--butter-deep); background: #FFF6D8; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 640px; }
.tile {
  width: 60px; height: 64px; border-radius: 18px; background: var(--water);
  box-shadow: 0 5px 0 var(--water-deep); font-family: var(--font-en); font-weight: 600; font-size: 34px; color: var(--ink);
}
.tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--water-deep); }
.tile.used { visibility: hidden; }
.tile.hint { animation: glow-tile .7s ease-in-out infinite alternate; }
@keyframes glow-tile { to { background: var(--butter); box-shadow: 0 5px 0 var(--butter-deep); } }

/* 排句子 */
.answer-line {
  min-height: 76px; width: 100%; border-radius: 20px; padding: 10px;
  background: #fff; box-shadow: inset 0 0 0 3px var(--line);
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
}
.chip {
  padding: 8px 16px; border-radius: 16px; background: var(--lilac); box-shadow: 0 4px 0 #A994DB;
  font-family: var(--font-en); font-size: 26px; font-weight: 500;
}
.chip.placed { background: #EEE7FF; box-shadow: 0 3px 0 #D3C6F5; }
.chip.used { visibility: hidden; }

/* 說說看 */
.mic {
  width: 132px; height: 132px; border-radius: 50%;
  background: var(--pink); box-shadow: 0 8px 0 var(--pink-deep);
  font-size: 56px; display: grid; place-items: center; color: #fff;
}
.mic:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--pink-deep); }
.mic.listening { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 8px 0 var(--pink-deep), 0 0 0 18px rgba(255,143,171,.25); } }
.heard { font-size: 20px; color: var(--ink-soft); min-height: 30px; }
.heard .en { color: var(--ink); }
.stars-row { font-size: 44px; letter-spacing: 6px; min-height: 56px; }

/* 吉祥物對話 */
.buddy { display: flex; align-items: flex-end; gap: 10px; }
.buddy svg { width: 96px; height: 96px; flex: none; }
.bubble {
  position: relative; background: #fff; border-radius: 22px; padding: 12px 18px;
  box-shadow: 0 4px 0 var(--line); font-size: 22px; text-align: left; max-width: 520px;
}
.bubble::before {
  content: ""; position: absolute; left: -10px; bottom: 18px; border: 10px solid transparent; border-right-color: #fff; border-left: 0;
}

/* 首頁 */
.hero { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 8px; }
.hero svg { width: 170px; height: 170px; }
.hero h1 { margin: 0; font-size: clamp(30px, 6vw, 42px); text-wrap: balance; }
.plan { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
@media (max-width: 560px) { .plan { grid-template-columns: 1fr; } }
.plan-item { background: #fff; border-radius: 24px; padding: 16px 18px; box-shadow: 0 5px 0 var(--line); text-align: left; display: flex; gap: 14px; align-items: center; }
.plan-item .emo { font-size: 40px; }
.plan-item b { display: block; font-size: 24px; }
.plan-item span { color: var(--ink-soft); font-size: 18px; }
.home-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.meta-row { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; color: var(--ink-soft); font-size: 18px; }

/* 單元與貼紙 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; width: 100%; }
.unit {
  border-radius: 20px; background: #fff; box-shadow: 0 4px 0 var(--line), inset 0 0 0 3px var(--line);
  padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.unit .num { font-family: var(--font-en); font-weight: 600; font-size: 22px; }
.unit .sub { font-size: 15px; color: var(--ink-soft); font-family: var(--font-en); }
.unit.cur { box-shadow: 0 4px 0 var(--pink-deep), inset 0 0 0 3px var(--pink); }
.unit.done { background: #FFF6D8; }
.sticker { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-emoji); font-size: 40px;
  background: #fff; box-shadow: 0 4px 0 var(--line); position: relative; }
.sticker small { position: absolute; bottom: -6px; font-family: var(--font-en); font-size: 13px; background: var(--butter); border-radius: 8px; padding: 0 6px; color: var(--ink); }
.sticker.empty { background: transparent; box-shadow: none; border: 3px dashed var(--line); font-size: 20px; color: var(--line); }

/* 結算 */
.result-stats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.stat { background: #fff; border-radius: 22px; padding: 12px 20px; box-shadow: 0 4px 0 var(--line); min-width: 130px; }
.stat b { display: block; font-family: var(--font-en); font-size: 40px; font-variant-numeric: tabular-nums; }
.learned { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.learned span { background: #fff; border-radius: 14px; padding: 4px 12px; box-shadow: 0 3px 0 var(--line); font-family: var(--font-en); font-size: 20px; }

.banner {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 80px); transform: translateX(-50%);
  z-index: 20; background: var(--butter); border-radius: 20px; padding: 10px 22px; box-shadow: 0 5px 0 var(--butter-deep); font-size: 22px; font-weight: 700;
}

/* 彩帶 */
.burst { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.burst i { position: absolute; font-style: normal; font-family: var(--font-emoji); font-size: 30px; animation: fly 1.1s ease-out forwards; }
@keyframes fly {
  from { transform: translate(0, 0) scale(.4) rotate(0); opacity: 1; }
  to { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; }
}
.wiggle { animation: wiggle .45s; }
@keyframes wiggle { 20%, 60% { transform: translateX(-8px) rotate(-1deg); } 40%, 80% { transform: translateX(8px) rotate(1deg); } }
.pop { animation: pop .4s; }
@keyframes pop { 40% { transform: scale(1.12); } }
/* 老虎媽媽 */
.tiger-mask {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(28, 12, 6, .84);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding-inline: 16px; text-align: center;
}
.tiger-mask svg { width: min(300px, 62vw); height: auto; filter: drop-shadow(0 10px 30px rgba(255, 120, 40, .45)); }
.tiger-mask .bubble { font-size: clamp(24px, 4.4vw, 34px); font-weight: 700; max-width: 640px; text-align: center; }
.tiger-mask .bubble::before { display: none; }
.tiger-mask .anger { position: absolute; font-family: var(--font-emoji); font-size: 56px; transform: translate(110px, -150px); }
.tiger-mask .tap { color: #FFD9C2; font-size: 20px; }
.tiger-peek {
  position: fixed; right: 12px; bottom: 0; z-index: 25;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  animation: peek-up .35s ease-out;
}
.tiger-peek svg { width: 150px; height: 150px; margin-bottom: -26px; }
.tiger-peek .bubble { font-size: 22px; font-weight: 700; }
.tiger-peek .bubble::before { display: none; }
@keyframes peek-up { from { transform: translateY(100%); } }
.quake { animation: quake .12s linear infinite; }
@keyframes quake {
  0% { transform: translate(0, 0); } 25% { transform: translate(-6px, 3px); }
  50% { transform: translate(5px, -4px); } 75% { transform: translate(-4px, -2px); } 100% { transform: translate(0, 0); }
}
/* ---------- 軟Q手感：一碰就壓扁再彈回來 ---------- */
.jelly { animation: jelly .42s ease-out; }
@keyframes jelly {
  0% { transform: scale(1, 1); } 30% { transform: scale(1.1, .86); } 55% { transform: scale(.94, 1.08); }
  75% { transform: scale(1.03, .97); } 100% { transform: scale(1, 1); }
}
.card { animation: card-in .38s cubic-bezier(.3, 1.5, .5, 1); }
.card.still { animation: none; }
@keyframes card-in { from { transform: scale(.88); opacity: 0; } }
.river-lamb svg { overflow: visible; }
.river-lamb.hop svg { animation: lamb-hop .7s cubic-bezier(.3, 1.4, .5, 1); }
@keyframes lamb-hop { 40% { transform: translateY(-26px) rotate(-180deg) scale(1.15); } 100% { transform: translateY(0) rotate(-360deg); } }
.aura-back { opacity: .6; }
.aura-dot { animation: twinkle 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
.aura-dot.d1 { animation-delay: .4s; } .aura-dot.d2 { animation-delay: .8s; } .aura-dot.d3 { animation-delay: 1.2s; }
@keyframes twinkle { from { opacity: .35; transform: translateY(3px) scale(.8); } to { opacity: 1; transform: translateY(-3px) scale(1.1); } }

/* ---------- 小島 ---------- */
.hello { margin: 0; font-size: clamp(28px, 5.4vw, 40px); }
.island-box { display: block; width: 100%; padding: 0; border-radius: 26px; overflow: hidden; box-shadow: inset 0 0 0 3px var(--line); background: #DDF4FA; }
.island-box svg { display: block; width: 100%; height: auto; }
.island-box.compact svg { height: clamp(220px, 40vh, 360px); }   /* 首頁：裁掉上面的天空，讓「開始練習」不被擠下去 */
.chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.pill { background: #fff; border-radius: 999px; padding: 6px 16px; box-shadow: 0 4px 0 var(--line); font-size: 19px; }
.pill b { font-family: var(--font-en); font-size: 22px; }
.friends { font-family: var(--font-emoji); font-size: 32px; letter-spacing: 4px; }

/* ---------- 跳出來的小視窗（寶箱、確定要休息嗎） ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 35; background: rgba(91, 59, 49, .55);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  padding: 16px; text-align: center;
}
.overlay .card { max-width: 560px; width: 100%; }
.overlay > .bubble { font-size: 26px; font-weight: 700; text-align: center; }
.overlay > .bubble::before { display: none; }
.chest { font-family: var(--font-emoji); font-size: 140px; line-height: 1; cursor: pointer; animation: chest-bob 1.2s ease-in-out infinite; }
.chest.shake { animation: quake .1s linear infinite; }
@keyframes chest-bob { 50% { transform: translateY(-12px) scale(1.04, .97); } }
.prize { font-family: var(--font-emoji); font-size: 110px; line-height: 1; animation: prize-in .6s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes prize-in { from { transform: scale(0) rotate(-90deg); } }
.rar { display: inline-block; font-size: 16px; font-weight: 700; padding: 2px 12px; border-radius: 10px; color: #fff; background: var(--ink-soft); }
.rar.r { background: var(--mint-deep); }
.rar.s { background: linear-gradient(90deg, #FF8FAB, #B99BEA, #4DB59D); }

/* ---------- 衣櫥 ---------- */
.wardrobe-lamb svg { width: 180px; height: 180px; overflow: visible; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.tab { padding: 8px 20px; border-radius: 16px; background: #fff; box-shadow: 0 4px 0 var(--line); font-size: 22px; font-weight: 700; }
.tab.on { background: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-deep); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; width: 100%; }
.item {
  border-radius: 22px; background: #fff; box-shadow: 0 5px 0 var(--line), inset 0 0 0 3px var(--line);
  padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.item .ie { font-family: var(--font-emoji); font-size: 50px; line-height: 1.15; }
.item b { font-size: 19px; }
.item .state { font-size: 17px; color: var(--ink-soft); }
.item.worn { background: #E2F8F1; box-shadow: 0 5px 0 var(--mint-deep), inset 0 0 0 3px var(--mint); }
.item.trying { background: #FFF6D8; box-shadow: 0 5px 0 var(--butter-deep), inset 0 0 0 3px var(--butter); }

/* ---------- 闖關地圖 ---------- */
.isle { width: 100%; }
.isle-head { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 24px; margin: 10px 0 0; }
.isle-head .emo { font-size: 34px; }
.isle-head .sub { font-size: 16px; color: var(--ink-soft); }
.map-row { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 22px 0 12px; }
.map-row.rev { direction: rtl; }
.map-row::before { content: ""; position: absolute; left: 10%; right: 10%; top: 55%; border-top: 7px dotted #EBCDAE; }
.node {
  position: relative; z-index: 1; direction: ltr; justify-self: center; width: 100%; max-width: 116px; aspect-ratio: 1;
  border-radius: 50%; background: #fff; box-shadow: 0 5px 0 var(--line), inset 0 0 0 3px var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.map-row .node:nth-child(even) { margin-top: 14px; }
.node .emo { font-size: 28px; line-height: 1.1; }
.node .num { font-family: var(--font-en); font-weight: 600; font-size: 20px; line-height: 1; }
.node .sub { font-family: var(--font-en); font-size: 13px; color: var(--ink-soft); }
.node.done { background: #FFF6D8; }
.node.cur { box-shadow: 0 5px 0 var(--pink-deep), inset 0 0 0 4px var(--pink); }
.node .flag { position: absolute; top: -12px; right: -4px; font-size: 26px; }

<body>
<main id="app" aria-live="polite"></main>
<script src="config.js"></script>
<script src="words.js"></script>
<script>
'use strict';
/* =========================================================
   陽寶的英文小島：Level 4 生字練習
   - 每次 15 分鐘：先複習到期的字，再學新字
   - 間隔複習（盒子 1~6，間隔 1/3/7/14/30/60 天）
   - 進度存平板 localStorage，並送到 Google Apps Script（config.js）
   ========================================================= */
const W = window.WORDS;
// 故事屋：故事檔加密放在 stories.enc.json，輸入密碼解開後才裝進來（見 loadStories）
let STORIES = [], STORY = {}, ALLW = W, BY_ID = Object.fromEntries(W.map(x => [x.id, x]));
// 故事的生字：跟 Level 4 重複的字直接用同一個（own：意思不一樣就另外算）
function installStories(list) {
  const extra = [];
  for (const st of list) {
    st.ids = st.vocab.map((v, i) => {
      const same = !v.own && W.find(x => x.w.toLowerCase() === v.w.toLowerCase());
      if (same) return same.id;
      const w = Object.assign({ id: `${st.id}-${i + 1}`, u: st.id }, v);
      extra.push(w);
      return w.id;
    });
  }
  STORIES = list;
  STORY = Object.fromEntries(list.map(x => [x.id, x]));
  ALLW = W.concat(extra);
  BY_ID = Object.fromEntries(ALLW.map(x => [x.id, x]));
}
const UNITS = [...new Set(W.map(x => x.u))];
const SESSION_MIN = 15;
const NEW_BATCH = 6;
const MAX_REVIEW = 8;
const INTERVAL = [0, 1, 3, 7, 14, 30, 60];
const NAME = '陽寶';
const COUNT_MIN = 10;      // 練滿幾分鐘，今天才算練過（老虎媽媽、小島、連續天數都看這個）
const MAX_RESCUE = 6;      // 救援站一次救幾個字
const RUN_N = 5;           // 獎勵關有幾個障礙
const MILESTONES = [3, 7, 14, 21, 30, 45, 60, 90, 120];   // 連續幾天送超稀有寶箱
const CFG = window.YB_CONFIG || {};
const LS_KEY = 'yangbao-l4-v1';
const $app = document.getElementById('app');

/* ---------- 小工具 ---------- */
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[rnd(a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = (d = new Date()) => { const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return today(d); };
const norm = s => s.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* ---------- 狀態 ---------- */
function blankState() {
  return {
    words: {}, stars: 0, badges: [], days: [], curUnit: UNITS[0], outbox: [], device: uid(),
    owned: ['bow'], wear: { head: 'bow' }, friends: 0, chests: [], bonusOn: '', lastStars: null,
    bosses: [], coupons: [], msgSeen: '', daily: null, gifts: [], stories: {},
    syncLog: [],     // 最近 20 次送資料的結果，跟著進度一起上傳，查「為什麼沒送上來」用
    pending: null,   // 練到一半關掉時的進度，下次打開時補記
  };
}
let S = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && s.words) {
      (s.outbox || []).forEach(e => { if (!e.eid) e.eid = uid(); });   // 舊版留下、還沒送出的紀錄補編號
      return Object.assign(blankState(), s);
    }
  } catch (e) {}
  return blankState();
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 解開故事檔 ----------
   stories.enc.json：PBKDF2-SHA256 推出金鑰、AES-256-GCM 加密（產生方式見 chiu2cc/陽寶英語教材/encrypt_stories.js）
   密碼只存在這台平板（不跟進度一起上傳） */
const SK_KEY = LS_KEY + '-sk';
let storyBox = null;   // 讀到的加密故事檔；null＝沒有故事屋
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlockStories(pass) {
  if (!storyBox || !(window.crypto && crypto.subtle)) return false;
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(storyBox.salt), iterations: storyBox.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(storyBox.iv) }, key, b64(storyBox.data));
    installStories(JSON.parse(new TextDecoder().decode(plain)));
    try { localStorage.setItem(SK_KEY, pass); } catch (e) {}
    return true;
  } catch (e) { return false; }   // 密碼錯
}
async function loadStories() {
  try { const r = await fetch('stories.enc.json'); if (r.ok) storyBox = await r.json(); } catch (e) {}
  let pass = null; try { pass = localStorage.getItem(SK_KEY); } catch (e) {}
  if (storyBox && pass && !(await unlockStories(pass))) { try { localStorage.removeItem(SK_KEY); } catch (e) {} }   // 換過密碼：請大人重新輸入
}

/* ---------- 進度回傳 ---------- */
// eid：每筆紀錄的編號，試算表端用來去掉重送的重複紀錄
function logEvent(ev) { S.outbox.push(Object.assign({ ts: new Date().toISOString(), eid: uid() }, ev)); save(); }
// 送資料：只有試算表回 {ok:true} 才算送到，才把平板上的紀錄刪掉；沒收到回應一律留著下次再送。
// （舊版在讀不到回應時改用 no-cors 再送、並假設送到就刪，平板送不出去時紀錄會靜靜消失）
let flushing = false, retryTimer = null;
function syncNote(res) {
  S.syncLog = (S.syncLog || []).concat([{ at: new Date().toISOString(), res, left: S.outbox.length }]).slice(-20);
  save();
}
async function flush(force) {
  if (!CFG.progressUrl || flushing) return;
  if (!S.outbox.length && !force) return;
  flushing = true;
  const batch = S.outbox.slice(0, 400);   // 一次最多 400 筆，太多就分批
  const snapshot = Object.assign({}, S, { outbox: [] });
  const body = JSON.stringify({ key: CFG.key, device: S.device, events: batch, state: snapshot, left: S.outbox.length });
  let res, ok = false;
  try {
    const r = await fetch(CFG.progressUrl, { method: 'POST', body });
    const txt = await r.text();
    let j = null; try { j = JSON.parse(txt); } catch (e) {}
    if (j && j.ok) {
      ok = true;
      const sent = new Set(batch.map(e => e.eid));
      S.outbox = S.outbox.filter(e => !sent.has(e.eid));
      res = `ok ${batch.length}${j.dup ? ` (dup ${j.dup})` : ''}`;
    } else res = `bad ${r.status} ${j ? (j.error || '') : txt.replace(/\s+/g, ' ').slice(0, 120)}`;
  } catch (e) {
    res = 'net ' + String((e && e.message) || e).slice(0, 120);
  }
  flushing = false;
  syncNote(res);
  if (ok && S.outbox.length) return flush();                 // 還有下一批
  clearTimeout(retryTimer);
  if (!ok && S.outbox.length) retryTimer = setTimeout(flush, 60000);   // 沒送到：開著網頁就每分鐘再試
  if (document.getElementById('sync')) document.getElementById('sync').innerHTML = syncLabel();
}
function syncLabel() {
  const last = (S.syncLog || []).slice(-1)[0];
  if (!CFG.progressUrl) return '☁️ 沒有設定雲端';
  if (S.outbox.length) return `☁️ 還有 ${S.outbox.length} 筆沒送出`;
  return last && last.res.startsWith('ok') ? '☁️ 已同步' : '☁️ 還沒同步過';
}
async function restoreIfEmpty() {
  if (!CFG.progressUrl || Object.keys(S.words).length) return;
  try {
    const r = await fetch(`${CFG.progressUrl}?action=state&key=${encodeURIComponent(CFG.key)}`);
    const j = await r.json();
    if (j && j.state && j.state.words) { S = Object.assign(blankState(), j.state, { outbox: [] }); save(); }
  } catch (e) {}
}

/* ---------- 聲音：唸英文 ---------- */
let voice = null;
// iPad／Mac 的英文聲音清單裡有 Bells、Bubbles、Zarvox 這類搞笑聲音，要跳過；優先挑美國腔、品質好的聲音
const ODD_VOICE = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|deranged|hysterical|junior|ralph|fred|kathy|grandma|grandpa|eddy|flo|reed|rocko|sandy|shelley/i;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang) && !ODD_VOICE.test(v.name));
  const score = v => (/^en[-_]US/i.test(v.lang) ? 10 : 0) + (/premium|enhanced|neural|natural/i.test(v.name) ? 4 : 0)
    + (/google/i.test(v.name) ? 3 : 0) + (/samantha|ava|allison|susan|zoe|nicky|aria|jenny/i.test(v.name) ? 2 : 0);
  voice = vs.sort((a, b) => score(b) - score(a))[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, slow) {
  if (!('speechSynthesis' in window)) return Promise.resolve();
  return new Promise(res => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : 'en-US'; if (voice) u.voice = voice;
    u.rate = slow ? 0.6 : 0.88; u.pitch = 1.05;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
    setTimeout(res, (3000 + text.length * 110) * (slow ? 1.5 : 1));   // 保險：沒收到唸完的通知也不會卡住（故事長句要等久一點）
  });
}

/* ---------- 音效 ---------- */
let actx = null;
function tone(freqs, dur = .12, type = 'sine', gap = .1) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const t = actx.currentTime + i * gap;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .05);
    });
  } catch (e) {}
}
const sfx = {
  yay: () => tone([784, 988, 1319], .18, 'triangle', .09),
  soft: () => tone([392, 349], .16, 'sine', .12),
  tap: () => tone([660], .06, 'sine'),
  fanfare: () => tone([523, 659, 784, 1047, 784, 1047], .2, 'triangle', .12),
};

/* ---------- 聽陽寶說話：語音辨識 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srOff = !SR;   // 不支援或被拒，就改成「跟著唸」
function listen() {
  return new Promise(res => {
    if (srOff) return res({ error: 'off' });
    let done = false, alts = [];
    const r = new SR();
    r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    r.onresult = e => { for (const result of e.results) for (const a of result) alts.push(a.transcript); };
    r.onerror = e => { if (['not-allowed', 'service-not-allowed', 'network', 'audio-capture'].includes(e.error)) { srOff = true; } finish({ error: e.error }); };
    r.onend = () => finish(alts.length ? { alts } : { error: 'no-speech' });
    function finish(v) { if (!done) { done = true; clearTimeout(t); res(v); } }
    const t = setTimeout(() => { try { r.stop(); } catch (e) {} }, 7000);
    try { speechSynthesis.cancel(); r.start(); } catch (e) { finish({ error: 'start' }); }
  });
}
function lev(a, b) {
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[m][n];
}
// 單字：任一候選含目標字（或很接近）就算對
function judgeWord(alts, target) {
  const t = norm(target);
  const tol = Math.max(1, Math.floor(t.length / 5));
  for (const a of alts.map(norm)) {
    if ((' ' + a + ' ').includes(' ' + t + ' ')) return true;
    if (!t.includes(' ') && a.split(' ').some(x => x.length > 2 && lev(x, t) <= tol)) return true;
    if (t.includes(' ') && lev(a, t) <= tol + 1) return true;
  }
  return false;
}
// 句子：取最好的候選，看對到幾成的字
function judgeSentence(alts, sentence) {
  const want = norm(sentence).split(' ');
  let best = 0;
  for (const a of alts) {
    const got = norm(a).split(' ');
    const pool = got.slice(); let hit = 0;
    for (const w of want) { const k = pool.findIndex(x => x === w || (w.length > 4 && lev(x, w) <= 1)); if (k >= 0) { hit++; pool.splice(k, 1); } }
    best = Math.max(best, hit / want.length);
  }
  return best;
}

const SEASONS = {
  xmas: {

    talk: [['Merry Christmas!', '聖誕快樂！'], ['Look! It is snowing!', '你看！下雪了！'], ['I want a big present!', '我想要一個大禮物！']],
  },
  cny: {

    deco: [['🏮', 122, 108, 28], ['🏮', 292, 100, 28], ['🧧', 238, 206, 22], ['🧨', 164, 210, 22], ['🎆', 76, 44, 40], ['🎇', 340, 36, 36]],

  },
};
function season(d = new Date()) {
  const f = location.hash.slice(1);
  if (SEASONS[f]) return Object.assign({ key: f }, SEASONS[f]);
  const md = (d.getMonth() + 1) * 100 + d.getDate();
  if (md >= 1201 && md <= 1226) return Object.assign({ key: 'xmas' }, SEASONS.xmas);
  const t = d.getTime();
  for (const s of CNY_DAYS) {
    const c = new Date(s + 'T00:00:00').getTime();
    if (t >= c - 7 * 86400000 && t < c + 15 * 86400000) return Object.assign({ key: 'cny', day: s }, SEASONS.cny);
  }
  return null;
}

  saySent: ['說對 2 個句子', 2, '🗣️'],

function dailyMissions() {
  const t = today();
  if (!S.daily || S.daily.date !== t) {
    const keys = Object.keys(MISSIONS).filter(k => k !== 'rescue' || rescueList().length);
    S.daily = { date: t, list: shuffle(keys).slice(0, 3).map(k => ({ k, n: 0 })), all: false };
    save();
  }
  return S.daily;
}
function mission(k, n = 1) {
  const d = dailyMissions();
  for (const m of d.list) {
    const goal = MISSIONS[m.k][1];
    if (m.k !== k || m.n >= goal) continue;
    m.n = Math.min(goal, m.n + n);
    if (m.n >= goal) { S.stars += 5; banner(`<span class="emo">${MISSIONS[k][2]}</span> 任務完成：${MISSIONS[k][0]}！+5 <span class="emo">⭐</span>`); logEvent({ type: 'mission', got: k }); }
  }
  if (!d.all && d.list.every(m => m.n >= MISSIONS[m.k][1])) {
    d.all = true; S.stars += 10;
    setTimeout(() => banner('今天的任務全部完成！再送 10 <span class="emo">⭐</span>', 3600), 1500);
  }
  save(); refreshStars();
}

// 合成吼聲：低頻鋸齒波＋濾過的雜訊＋顫動
function roar(fierce) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const dur = fierce ? 2.2 : 1.0, peak = fierce ? 0.95 : 0.35, t0 = actx.currentTime + .02;
    const out = actx.createGain();
    out.gain.setValueAtTime(.0001, t0);
    out.gain.exponentialRampToValueAtTime(peak, t0 + .12);
    out.gain.setValueAtTime(peak, t0 + dur * .6);
    out.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    out.connect(actx.destination);
    const lfo = actx.createOscillator(), lfoGain = actx.createGain();
    lfo.frequency.value = 22; lfoGain.gain.value = peak * .35;
    lfo.connect(lfoGain).connect(out.gain);
    [[120, 70, 'sawtooth'], [62, 40, 'sawtooth'], [180, 110, 'square']].forEach(([f0, f1, type], i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      g.gain.value = i === 2 ? .12 : .4;
      o.connect(g).connect(out); o.start(t0); o.stop(t0 + dur + .05);
    });
    const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * dur), actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const n = actx.createBufferSource(), lp = actx.createBiquadFilter(), ng = actx.createGain();
    n.buffer = buf; lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t0); lp.frequency.exponentialRampToValueAtTime(250, t0 + dur);
    ng.gain.value = .6;
    n.connect(lp).connect(ng).connect(out); n.start(t0);
    lfo.start(t0); lfo.stop(t0 + dur + .05);
  } catch (e) {}

}

/* =========================================================
   練習流程
   ========================================================= */
let ses = null;     // 本次練習
let timerId = null;

function dueList() {
  const t = today();
  return Object.entries(S.words)
    .filter(([id, r]) => r.box >= 1 && r.due <= t && BY_ID[id])
    .sort((a, b) => a[1].due.localeCompare(b[1].due) || a[1].box - b[1].box)
    .map(([id]) => id);

function unitWords(u) { return W.filter(x => x.u === u); }
function unitLeft(u) { return unitWords(u).filter(x => !S.words[x.id]); }
// 還沒學、這次練習也還沒排進來的字（這次排進來的要到結算才寫進進度，不扣掉的話，學完一個單元會以為還有字、接不到下一個單元）
function leftNow(u) { return unitLeft(u).filter(x => !(ses && ses.res[x.id])); }
// 還沒打贏上一座島魔王的島，關卡不開
function nextUnit(from) {
  const i = Math.max(0, UNITS.indexOf(from));
  for (let k = 0; k < UNITS.length; k++) { const u = UNITS[(i + k) % UNITS.length]; if (leftNow(u).length && isleOpen(isleOf(u))) return u; }
  return null;
}
function nextNewBatch() {
  const u = nextUnit(S.curUnit);
  if (u == null) return [];
  S.curUnit = u;
  const left = leftNow(u);
  // 剩不多就一次學完，免得只剩 1、2 個字
  const n = left.length <= NEW_BATCH + 2 ? left.length : NEW_BATCH;
  return left.slice(0, n);
}

function startSession(mode = 'normal') {
  sfx.tap();
  clearInterval(homeTimer); idleAt = Date.now();
  ses = {
    sid: uid(), mode, start: Date.now(), elapsed: 0, last: Date.now(), timeUp: false,
    queue: [], res: {}, newIds: [], reviewIds: [], stars: 0, cur: null, doneQ: 0, total: 0,
  };
  if (mode === 'rescue') {
    // 救援站：每個字考「選意思」和「拼字（或聽音選字）」，兩題都一次答對才算救出來
    const ids = rescueList().slice(0, MAX_RESCUE), qs = [];
    for (const id of ids) {
      ses.res[id] = { first: true, review: true };
      const w = BY_ID[id];
      qs.push({ t: 'meaning', w }, { t: w.sp ? 'spell' : 'listen', w });
    }

    const due = dueList().slice(0, MAX_REVIEW);

function addNewBatch() {
  const batch = nextNewBatch();
  if (!batch.length) {
    const g = pendingBoss();
    if (g != null && ses.bossQueued !== g) {   // 同一隻魔王一次練習只排一次
      ses.bossQueued = g;
      ses.queue.push({ t: 'note', text: `<b>${ISLES[g % ISLES.length][1]}</b>的魔王「貪吃雲」出現了！<br>牠把字都吃掉了，打贏牠才能去下一座島！`, mood: 'wow' }, { t: 'boss', g }, { t: 'more' });
      return true;
    }
    return false;
  }
  ses.lastBatch = 'new';
  for (const w of batch) { ses.res[w.id] = { first: true, review: false }; ses.newIds.push(w.id); }
  const u = batch[0].u;
  ses.queue.push({ t: 'note', text: `新單元 <b class="en">NCL4-${u}</b>：認識 <b>${batch.length}</b> 個新朋友！`, mood: 'cheer' });
  batch.forEach(w => ses.queue.push({ t: 'intro', w }));
  ses.queue.push({ t: 'note', text: '記住了嗎？來玩遊戲考考看！', mood: 'smile' });
  shuffle(batch).forEach(w => ses.queue.push({ t: 'meaning', w }));
  shuffle(batch).forEach(w => ses.queue.push({ t: w.sp ? 'spell' : 'listen', w }));
  shuffle(batch).forEach((w, i) => ses.queue.push({ t: (i % 2 === 0 && w.s.split(' ').length <= 10) ? 'order' : 'sentMean', w }));
  shuffle(batch).filter(w => w.s.split(' ').length <= 9).slice(0, 2).forEach(w => ses.queue.push({ t: 'saySent', w }));
  ses.queue.push({ t: 'retry', ids: batch.map(w => w.id) });
  ses.queue.push({ t: 'more' });
  return true;
}

// 排一批複習題，後面接 more，練習還有時間就繼續排下一批
function queueReview(ids, text, extra) {
  ses.lastBatch = 'review';
  const qs = ids.map(id => {
    ses.res[id] = { first: true, review: true, extra: !!extra };
    ses.reviewIds.push(id);
    const w = BY_ID[id];
    return { t: pick(w.sp ? ['meaning', 'spell', 'spell', 'sentMean'] : ['meaning', 'listen', 'sentMean']), w };
  });
  ses.queue.push({ t: 'note', text, mood: extra ? 'cheer' : 'smile' }, ...shuffle(qs), { t: 'more' });

// 還沒排進這次練習的到期字（一次只排 MAX_REVIEW 個，所以要分批補，不然到期的字會越積越多）
function addReviewBatch() {
  const due = dueList().filter(id => !ses.res[id]).slice(0, MAX_REVIEW);
  if (!due.length) return false;
  queueReview(due, `再複習 <b>${due.length}</b> 個以前學過的字！`);

// 新字學完、也沒有到期的字：挑比較不熟的字多練。不算正式複習：答對不升盒子，答錯一樣回第 1 盒
function addExtraBatch() {
  const ids = Object.entries(S.words).filter(([id]) => BY_ID[id] && !ses.res[id])
    .sort((a, b) => a[1].box - b[1].box || (b[1].miss || 0) - (a[1].miss || 0))
    .slice(0, NEW_BATCH).map(([id]) => id);
  if (!ids.length) return false;
  queueReview(ids, '新字都學完了！我們挑幾個比較不熟的字多練練～', true);
  return true;

function tick() {

function markMiss(w) { if (ses.res[w.id]) ses.res[w.id].first = false; }
function gainStar(n = 1) {
  ses.stars += n; S.stars += n; save();
  const c = document.querySelector('.star-count b');
  if (c) { c.textContent = S.stars; c.parentElement.classList.remove('pop'); void c.offsetWidth; c.parentElement.classList.add('pop'); }
  // 頂列的小羊翻一圈
  const rl = document.querySelector('.river-lamb');
  if (rl) { rl.classList.remove('hop'); void rl.offsetWidth; rl.classList.add('hop'); }
}
function answerLog(step, ok, tries, extra = {}) {
  const r = ses.res[step.w.id];
  if (r) { r.quizzed = true; r.qn = (r.qn || 0) + 1; }
  ses.doneQ++; keep();
  if (ok) mission('first');
  logEvent(Object.assign({ type: 'answer', sid: ses.sid, id: step.w.id, w: step.w.w, u: step.w.u, task: step.t, first: ok, tries }, extra));
}

function next() {
  if (!ses) return;
  if (ses.timeUp && ses.cur && ses.cur.t !== 'note') return finish();
  const step = ses.queue.shift();
  ses.cur = step;
  if (!step) { ses.allDone = ses.mode === 'normal'; return finish(); }
  if (step.t === 'retry') {
    // 這批答錯過的字，再考一次
    const miss = step.ids.filter(id => !ses.res[id].first);
    if (miss.length) {
      ses.queue.unshift(...shuffle(miss).map(id => ({ t: BY_ID[id].sp ? 'spell' : 'meaning', w: BY_ID[id], again: true })));
      ses.queue.unshift({ t: 'note', text: '剛剛有幾個字比較難，我們再見它們一次！', mood: 'smile' });
    }
    return next();
  }
  if (step.t === 'storyEnd') { ses.storyDone = true; return finish(); }
  if (step.t === 'more') {
    if (ses.timeUp) return finish();
    if (ses.elapsed > (SESSION_MIN - 3) * 60000) return finish();
    // 剛複習完就先學新字，剛學完新字就先補複習；都沒有了才挑不熟的字多練
    const order = ses.lastBatch === 'review' ? [addNewBatch, addReviewBatch] : [addReviewBatch, addNewBatch];
    if (order[0]() || order[1]() || addExtraBatch()) return next();
    ses.allDone = true; return finish();
  }
  // 複習到很熟（第 4 盒以上）的字，拼字改成大師級：沒有字母磚，自己打
  const master = step.t === 'spell' && ses.mode !== 'rescue' && S.words[step.w.id] && S.words[step.w.id].box >= 4;
  ({ note: viewNote, intro: viewIntro, meaning: viewMeaning, listen: viewListen, spell: master ? viewSpellMaster : viewSpell,
    sentMean: viewSentMean, order: viewOrder, saySent: viewSaySent, boss: viewBoss, page: viewPage, storyQ: viewStoryQ }[step.t])(step);
}

/* ---------- 版面骨架 ---------- */
function frame(inner) {
  $app.innerHTML = '';
  const top = h(`<div class="topbar">
    <button class="icon-btn" id="home" aria-label="回首頁"><span class="emo">🏠</span></button>
    <div class="river" aria-label="練習時間"><div class="river-fill"></div><div class="river-lamb">${lamb('smile')}</div></div>
    <div class="star-count"><span class="emo">⭐</span><b>${S.stars}</b></div>
  </div>`);
  top.querySelector('#home').onclick = () => {
    sfx.tap();
    if (!ses) return home();
    if (ses.mode === 'rescue' || ses.elapsed >= COUNT_MIN * 60000 || S.days.includes(today())) return finish();
    askQuit();   // 還沒練滿就想跑：先問一下，不然老虎媽媽一下就被躲掉了
  };
  $app.appendChild(top);
  const card = h(`<section class="card">${inner}</section>`);
  $app.appendChild(card);
  tick();
  return card;
}
function nextBtn(card, label = '下一題', cls = 'mint') {
  const b = h(`<button class="btn ${cls}" id="next">${label} <span class="emo">➜</span></button>`);
  b.onclick = () => { sfx.tap(); if ('speechSynthesis' in window) speechSynthesis.cancel(); next(); };
  card.appendChild(b);
  return b;
}
function hilite(s, w) {
  const sl = s.toLowerCase(), wl = w.toLowerCase();
  const tries = [wl, wl.length > 4 ? wl.slice(0, -1) : null, wl.length > 5 ? wl.slice(0, -2) : null].filter(Boolean);
  for (const t of tries) {
    let i = sl.indexOf(t);
    while (i >= 0 && i > 0 && /[a-z]/.test(sl[i - 1])) i = sl.indexOf(t, i + 1);
    if (i >= 0) {
      let j = i + t.length; while (j < s.length && /[a-zA-Z-]/.test(s[j])) j++;
      return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, j)) + '</mark>' + esc(s.slice(j));
    }
  }
  return esc(s);
}

function wireSpeak(card, step, target, kind) {
  const mic = card.querySelector('#mic'), heard = card.querySelector('#heard'), st = card.querySelector('#sstars');
  let tries = 0, best = 0, passed = false;
  if (srOff) {
    mic.innerHTML = '<span class="emo">🙋</span>';
    mic.setAttribute('aria-label', '我唸好了');
    let said = false;
    mic.onclick = () => {
      sfx.yay(); burstAt(mic); heard.textContent = '好勇敢！唸出來就是最棒的！';
      logEvent({ type: 'speak', sid: ses.sid, id: step.w.id, w: step.w.w, kind, mode: 'self' });
      if (!said) { said = true; mission(kind === 'word' ? 'sayWord' : 'saySent'); }
    };
    return;
  }
  mic.onclick = async () => {
    if (mic.classList.contains('listening')) return;
    mic.classList.add('listening'); heard.textContent = '小羊在聽……';
    const r = await listen();
    if (!ses || !document.body.contains(mic)) return;   // 聽的時候已經離開這一題
    mic.classList.remove('listening');
    if (r.error) {
      if (srOff) { heard.textContent = '麥克風沒辦法用，我們改成跟著唸！'; wireSpeak(card, step, target, kind); return; }
      heard.textContent = r.error === 'no-speech' ? '沒聽到聲音耶，大聲一點點再試一次～' : '再按一次麥克風試試看～';
      return;
    }
    tries++;
    let ok, stars;
    if (kind === 'word') { ok = judgeWord(r.alts, target); stars = ok ? 3 : 0; }
    else { const sc = judgeSentence(r.alts, target); best = Math.max(best, sc); stars = sc >= .85 ? 3 : sc >= .6 ? 2 : sc >= .3 ? 1 : 0; ok = stars >= 2; }
    heard.innerHTML = `小羊聽到：<span class="en">${esc(r.alts[0] || '')}</span>`;
    st.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    st.classList.add('emo');
    logEvent({ type: 'speak', sid: ses.sid, id: step.w.id, w: step.w.w, kind, ok, stars, tries, heard: r.alts[0] || '' });
    if (ok) {
      sfx.yay(); burstAt(mic, ['🎉', '⭐', '💖', '🎶']);
      heard.innerHTML += '<br><b>唸得好棒！</b>';
      if (tries === 1) gainStar();
      if (!passed) { passed = true; mission(kind === 'word' ? 'sayWord' : 'saySent'); }
    } else if (tries >= 3) {
      sfx.soft();
      heard.innerHTML += '<br><b>好棒，你很努力！我們下次再挑戰～</b>';
    } else {
      sfx.soft();
      heard.innerHTML += '<br>再聽一次 🔊，然後再唸一次！';
    }
  };
}

function distractors(w, n, field) {
  const near = ALLW.filter(x => x.id !== w.id && x[field] !== w[field] && x.w.toLowerCase() !== w.w.toLowerCase());
  const same = shuffle(near.filter(x => Math.abs(x.u - w.u) <= 4));
  const far = shuffle(near);
  const out = [], seen = new Set([w[field]]);
  for (const x of same.concat(far)) { if (!seen.has(x[field])) { seen.add(x[field]); out.push(x[field]); } if (out.length >= n) break; }
  return out;
}

function choiceQuiz(step, { prompt, tag, body, options, answer, cls = '', after }) {
  const card = frame(`
    <div class="prompt"><span class="tag">${tag}</span> ${prompt}</div>
    ${body}
    <div class="choices ${options.some(o => o.length > 18) ? 'one' : ''}"></div>
    <div class="heard" id="msg"></div>
  `);
  const box = card.querySelector('.choices'), msg = card.querySelector('#msg');
  let tries = 0, done = false;
  for (const o of shuffle(options)) {
    const b = h(`<button class="choice ${cls} ${o.length > 18 ? 'long' : ''}">${esc(o)}</button>`);
    b.onclick = () => {
      if (done) return;
      tries++;
      if (o === answer) {
        done = true; b.classList.add('right'); sfx.yay(); burstAt(b);
        msg.innerHTML = `<b>${pick(CHEERS)}</b>`;
        if (tries === 1) gainStar(); else markMiss(step.w);
        answerLog(step, tries === 1, tries);
        if (after) after(card);
        nextBtn(card);
      } else {
        sfx.soft(); wiggle(b); b.classList.add('tried');
        msg.textContent = pick(SOFTS);
        if (tries >= 2) { [...box.children].find(x => x.textContent === answer).classList.add('glow'); msg.textContent = '答案在發亮的地方喔！'; }
      }
    };
    box.appendChild(b);
  }
  return card;
}

function viewSpell(step) {
  const w = step.w, word = w.w.toLowerCase(), L = word.length;
  const extra = 'aeioulnrst'.split('').filter(c => !word.includes(c));
  const letters = shuffle(word.split('').concat(shuffle(extra).slice(0, L > 7 ? 1 : 2)));
  const card = frame(`
    <div class="prompt"><span class="tag">拼拼看</span> 聽發音，把字拼出來</div>
    <div class="emoji-big">${w.e}</div>
    <div class="gloss">${esc(w.g)}</div>
    <div class="row">
      <button class="icon-btn" id="sp" aria-label="聽發音"><span class="emo">🔊</span></button>
      <button class="icon-btn" id="slow" aria-label="慢慢唸"><span class="emo">🐢</span></button>
    </div>
    <div class="slots">${word.split('').map(() => '<div class="slot"></div>').join('')}</div>
    <div class="tiles">${letters.map((c, i) => `<button class="tile" data-i="${i}">${c}</button>`).join('')}</div>
    <div class="row"><button class="btn soft small" id="clear">重來</button></div>
    <div class="heard" id="msg"></div>
  `);
  const slots = [...card.querySelectorAll('.slot')], tiles = [...card.querySelectorAll('.tile')], msg = card.querySelector('#msg');
  const fill = new Array(L).fill(null);    // 每格放的 tile 索引
  const locked = new Array(L).fill(false);
  let tries = 0, done = false;
  card.querySelector('#sp').onclick = () => say(w.w);
  card.querySelector('#slow').onclick = () => say(w.w, true);
  function render() {
    slots.forEach((s, k) => {
      s.textContent = fill[k] == null ? '' : letters[fill[k]];
      s.classList.toggle('filled', fill[k] != null && !locked[k]);
      s.classList.toggle('locked', locked[k]);
    });
    tiles.forEach((t, i) => t.classList.toggle('used', fill.includes(i)));
  }
  function lockLetters(n) {   // 提示：從頭開始幫忙放好 n 個字母
    clearFree();
    for (let k = 0; k < n; k++) {
      if (locked[k]) continue;
      const i = letters.findIndex((c, idx) => c === word[k] && !fill.includes(idx));
      fill[k] = i; locked[k] = true;
    }
    render();
  }
  function clearFree() { fill.forEach((v, k) => { if (!locked[k]) fill[k] = null; }); }
  tiles.forEach(t => t.onclick = () => {
    if (done) return;
    const k = fill.findIndex(v => v == null); if (k < 0) return;
    sfx.tap(); fill[k] = Number(t.dataset.i); render();
    if (fill.every(v => v != null)) check();
  });
  slots.forEach((s, k) => s.onclick = () => { if (done || locked[k] || fill[k] == null) return; fill[k] = null; render(); });
  card.querySelector('#clear').onclick = () => { if (done) return; clearFree(); render(); };
  function check() {
    const got = fill.map(i => letters[i]).join('');
    tries++;
    if (got === word) {
      done = true; sfx.yay(); burstAt(slots[Math.floor(L / 2)]);
      msg.innerHTML = `<b>${pick(CHEERS)}</b>`;
      if (tries === 1) { gainStar(); mission('spell'); } else markMiss(w);
      answerLog(step, tries === 1, tries, { got });
      say(w.w); nextBtn(card);
      return;
    }
    sfx.soft(); wiggle(card.querySelector('.slots'));
    logEvent({ type: 'spellTry', sid: ses.sid, id: w.id, w: w.w, got });
    if (tries === 1) { msg.textContent = '差一點點！小羊幫你放好第一個字母～'; setTimeout(() => lockLetters(1), 450); }
    else if (tries === 2) { msg.textContent = '再幫你放好一半，加油！'; setTimeout(() => lockLetters(Math.max(2, Math.ceil(L / 2))), 450); }
    else {
      done = true; markMiss(w);
      setTimeout(() => { lockLetters(L); msg.innerHTML = '<b>我們一起記住它！</b>念一遍：<span class="en">' + esc(w.w) + '</span>'; say(w.w, true); }, 450);
      answerLog(step, false, tries, { got });
      nextBtn(card);
    }
  }
  setTimeout(() => say(w.w), 300);
}

function viewOrder(step) {
  const w = step.w, toks = w.s.split(' ');
  let order = shuffle(toks.map((_, i) => i));
  if (order.every((v, i) => v === i) && toks.length > 1) order = order.reverse();
  const card = frame(`
    <div class="prompt"><span class="tag">排句子</span> 把句子排回來</div>
    <div class="zh">${esc(w.z)}</div>
    <div class="answer-line" id="line"></div>
    <div class="row" id="pool">${order.map(i => `<button class="chip" data-i="${i}">${esc(toks[i])}</button>`).join('')}</div>
    <div class="row"><button class="icon-btn" id="sp" aria-label="聽例句"><span class="emo">🔊</span></button></div>
    <div class="heard" id="msg"></div>
  `);
  const line = card.querySelector('#line'), pool = card.querySelector('#pool'), msg = card.querySelector('#msg');
  const placed = []; let tries = 0, done = false, keep = 0;   // keep：前面幾個字已經固定（不是 keep() 存檔）
  card.querySelector('#sp').onclick = () => say(w.s);
  function render() {
    line.innerHTML = '';
    placed.forEach((i, k) => {
      const c = h(`<button class="chip placed">${esc(toks[i])}</button>`);
      c.onclick = () => { if (done || k < keep) return; placed.splice(k, 1); render(); };
      line.appendChild(c);
    });
    pool.querySelectorAll('.chip').forEach(c => c.classList.toggle('used', placed.includes(Number(c.dataset.i))));
  }
  pool.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    if (done) return; const i = Number(c.dataset.i); if (placed.includes(i)) return;
    sfx.tap(); placed.push(i); render();
    if (placed.length === toks.length) check();
  });
  function check() {
    tries++;
    const got = placed.map(i => toks[i]);
    const ok = got.every((t, k) => t === toks[k]);
    if (ok) {
      done = true; sfx.yay(); burstAt(line);
      msg.innerHTML = `<b>${pick(CHEERS)}</b>`;
      if (tries === 1) gainStar(); else markMiss(w);
      mission('order');
      answerLog(step, tries === 1, tries);
      say(w.s); nextBtn(card); return;
    }
    sfx.soft(); wiggle(line);
    // 保留前面排對的部分
    let k = 0; while (k < got.length && got[k] === toks[k]) k++;
    if (tries >= 2) {
      done = true; markMiss(w);
      placed.length = 0; toks.forEach((_, i) => placed.push(i)); keep = toks.length; render();
      msg.innerHTML = '<b>答案是這樣排喔！</b>我們聽一次 🔊';
      answerLog(step, false, tries); say(w.s); nextBtn(card); return;
    }
    keep = Math.max(k, 1);
    // 第一個字一定幫忙放好
    if (k === 0) { placed.length = 0; placed.push(toks.findIndex((_, i) => i === 0)); }
    else placed.length = k;
    msg.textContent = k ? `前面 ${k} 個排對了！後面再試試看～` : '小羊幫你放好第一個字，再試試看～';
    setTimeout(render, 400);
  }
}

// 大師級拼字：只有鍵盤，提示規則跟字母磚一樣（第 1 次錯放好第一個字母、第 2 次放好一半、第 3 次公布）
function viewSpellMaster(step) {
  const w = step.w, word = w.w.toLowerCase(), L = word.length;
  const rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  const card = frame(`

      <button class="icon-btn" id="slow" aria-label="慢慢唸"><span class="emo">🐢</span></button>
    </div>
    <div class="slots">${word.split('').map(() => '<div class="slot"></div>').join('')}</div>

  `);
  const slots = [...card.querySelectorAll('.slot')], msg = card.querySelector('#msg');
  let typed = [], locked = 0, tries = 0, done = false;
  card.querySelector('#sp').onclick = () => say(w.w);
  card.querySelector('#slow').onclick = () => say(w.w, true);
  const render = () => slots.forEach((s, k) => {
    s.textContent = typed[k] || '';
    s.classList.toggle('filled', k < typed.length && k >= locked);
    s.classList.toggle('locked', k < locked);
  });
  card.querySelectorAll('.key').forEach(b => b.onclick = () => {
    if (done || typed.length >= L) return;
    sfx.tap(); typed.push(b.dataset.c); render();
    if (typed.length === L) check();
  });
  card.querySelector('#bs').onclick = () => { if (done || typed.length <= locked) return; typed.pop(); render(); };
  function lock(n) { locked = n; typed = word.slice(0, n).split(''); render(); }
  function check() {
    const got = typed.join('');
    tries++;
    if (got === word) {
      done = true; sfx.yay(); burstAt(slots[Math.floor(L / 2)], ['👑', '⭐', '🌟', '✨']);
      msg.innerHTML = `<b>大師級！${pick(CHEERS)}</b>`;
      if (tries === 1) { gainStar(2); mission('spell'); } else markMiss(w);
      answerLog(step, tries === 1, tries, { got, kind: 'master' });
      say(w.w); nextBtn(card);
      return;
    }
    sfx.soft(); wiggle(card.querySelector('.slots'));
    logEvent({ type: 'spellTry', sid: ses.sid, id: w.id, w: w.w, got, kind: 'master' });
    if (tries === 1) { msg.textContent = '差一點點！小羊幫你放好第一個字母～'; setTimeout(() => lock(1), 450); }
    else if (tries === 2) { msg.textContent = '再幫你放好一半，加油！'; setTimeout(() => lock(Math.max(2, Math.ceil(L / 2))), 450); }
    else {
      done = true; markMiss(w);
      setTimeout(() => { lock(L); msg.innerHTML = '<b>我們一起記住它！</b>念一遍：<span class="en">' + esc(w.w) + '</span>'; say(w.w, true); }, 450);
      answerLog(step, false, tries, { got, kind: 'master' });
      nextBtn(card);
    }
  }
  setTimeout(() => say(w.w), 300);
}

// 魔王關：用這座島的字出 8 題（選意思、聽音選字輪流），答對就打掉一顆心；沒有失敗
function viewBoss(step) {
  const g = step.g, name = ISLES[g % ISLES.length][1], us = isleUnits(g);
  const pool = shuffle(W.filter(w => us.includes(w.u)));
  let hp = BOSS_HP, k = 0, firsts = 0;
  const card = frame(`
    <div class="prompt"><span class="tag">魔王關</span> ${name}的貪吃雲</div>
    <div class="boss float" id="boss">${bossSvg(g, 'mad')}</div>
    <div class="hp" id="hp"></div>
    <div class="run-q" id="q"></div>
  `);
  const bossEl = card.querySelector('#boss'), hpEl = card.querySelector('#hp'), q = card.querySelector('#q');
  function round() {
    hpEl.textContent = '💜'.repeat(hp) + '🤍'.repeat(BOSS_HP - hp);
    if (hp <= 0) return win();
    const w = pool[k % pool.length], listen = k % 2 === 1; k++;
    const opts = listen ? [w.w, ...distractors(w, 3, 'w')] : [w.g, ...distractors(w, 3, 'g')];
    const ans = listen ? w.w : w.g;
    q.innerHTML = listen
      ? `<div class="row"><button class="icon-btn" id="sp" aria-label="聽發音"><span class="emo">🔊</span></button><span class="zh">聽到哪一個？</span></div>`
      : `<div class="row"><div class="word" style="font-size:clamp(36px,7vw,56px)">${esc(w.w)}</div><button class="icon-btn" id="sp" aria-label="聽發音"><span class="emo">🔊</span></button></div>`;
    q.insertAdjacentHTML('beforeend', `<div class="choices"></div><div class="heard" id="msg">答對就能打中貪吃雲！</div>`);
    q.querySelector('#sp').onclick = () => say(w.w);
    say(w.w);
    const box = q.querySelector('.choices');
    let tries = 0, done = false;
    for (const o of shuffle(opts)) {
      const b = h(`<button class="choice ${listen ? 'en' : ''}">${esc(o)}</button>`);
      b.onclick = () => {
        if (done) return;
        tries++;
        if (o === ans) {
          done = true; b.classList.add('right'); sfx.yay(); burstAt(bossEl, ['💥', '⭐', '✨']);
          if (tries === 1) { firsts++; gainStar(); }
          hp--;
          bossEl.classList.remove('hit', 'float'); void bossEl.offsetWidth; bossEl.classList.add('hit');
          setTimeout(() => {
            if (!ses || !document.body.contains(card)) return;   // 中途離開了
            bossEl.classList.remove('hit'); bossEl.classList.add('float'); round();
          }, 800);
        } else {
          sfx.soft(); wiggle(b); b.classList.add('tried');
          q.querySelector('#msg').textContent = '嘿嘿～貪吃雲在偷笑，再想想！';
          if (tries >= 2) { [...box.children].find(x => x.textContent === ans).classList.add('glow'); q.querySelector('#msg').textContent = '答案在發亮的地方喔！'; }
        }
      };
      box.appendChild(b);
    }
  }
  function win() {
    if (!S.bosses.includes(g)) S.bosses.push(g);
    S.chests.push('bonus'); save();
    logEvent({ type: 'boss', sid: ses.sid, u: g + 1, first: firsts, tries: k });
    bossEl.innerHTML = bossSvg(g, 'happy');
    sfx.fanfare(); burst(innerWidth / 2, innerHeight / 3, ['🎉', '⭐', '💜', '🌈']);
    q.innerHTML = buddy(`打贏了！貪吃雲把吃掉的字吐出來，變成好朋友了！<br>得到一個寶箱，練完回首頁就能打開～`, 'cheer');
    const nx = ISLES[(g + 1) % ISLES.length];
    nextBtn(card, (g + 1) * 10 < UNITS.length ? `前往${nx[1]}！` : '太厲害了！', 'butter');
  }
  round();
}

/* ---------- 故事屋 ----------
   一本故事：先認識還沒學過的生字（跟平常一樣進間隔複習）→ 一頁一頁聽故事、跟著唸 → 回答問題
   不計時，讀完一本才算讀完；第一次讀完送寶箱 */
function startStory(id) {
  const st = STORY[id];
  if (!st) return home();
  sfx.tap();
  clearInterval(homeTimer); idleAt = Date.now();
  ses = {
    sid: uid(), mode: 'story', story: id, start: Date.now(), elapsed: 0, last: Date.now(), timeUp: false,
    queue: [], res: {}, newIds: [], reviewIds: [], stars: 0, cur: null, doneQ: 0, total: 0,
  };
  const q = ses.queue, fresh = st.ids.filter(i => !S.words[i]).map(i => BY_ID[i]);
  q.push({ t: 'note', mood: 'cheer', text: `今天的故事是 <b class="en">${esc(st.title)}</b>（${esc(st.zh)}）！`
    + (fresh.length ? `<br>先認識故事裡的 <b>${fresh.length}</b> 個生字。` : '<br>生字都學過了，直接聽故事！') });
  if (fresh.length) {
    for (const w of fresh) { ses.res[w.id] = { first: true, review: false }; ses.newIds.push(w.id); }
    fresh.forEach(w => q.push({ t: 'intro', w }));
    q.push({ t: 'note', text: '記住了嗎？來考考看！', mood: 'smile' });
    shuffle(fresh).forEach(w => q.push({ t: 'meaning', w }));
    shuffle(fresh).forEach(w => q.push({ t: w.sp ? 'spell' : 'listen', w }));
    q.push({ t: 'retry', ids: fresh.map(w => w.id) });
  }
  q.push({ t: 'note', mood: 'cheer', text: '故事時間到！小羊會一句一句唸給你聽。<br>點句子可以再聽一次，按 <span class="emo">🎤</span> 跟著唸那一句～' });
  st.pages.forEach((_, i) => q.push({ t: 'page', st: id, i }));
  q.push({ t: 'note', text: '故事聽完了！來回答幾個問題～', mood: 'smile' });

  ses.total = q.filter(x => x.t !== 'note').length;
  logEvent({ type: 'start', sid: ses.sid, kind: 'story', got: id, review: 0 });
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);

}
// 句子裡的生字畫上底線，點了可以聽（stem：去掉最後一個字母，才對得到 cicadas、flattered 這類變化）
function markVocab(s, vocab) {
  const hits = [];
  for (const w of vocab) {
    for (const t of [w.w, w.alt].filter(Boolean).map(x => x.toLowerCase())) {
      const stem = t.length > 4 ? t.slice(0, -1) : t;
      const re = new RegExp(`\\b${stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}[a-z]*`, 'gi');
      let m;
      while ((m = re.exec(s))) {
        const a = m.index, b = a + m[0].length;
        if (!hits.some(x => a < x[1] && b > x[0])) hits.push([a, b, w.id]);
      }
    }
  }
  hits.sort((x, y) => x[0] - y[0]);
  let out = '', at = 0;
  for (const [a, b, id] of hits) { out += esc(s.slice(at, a)) + `<mark class="vw" data-id="${id}">${esc(s.slice(a, b))}</mark>`; at = b; }
  return out + esc(s.slice(at));
}
function viewPage(step) {
  const st = STORY[step.st], pg = st.pages[step.i], vocab = st.ids.map(id => BY_ID[id]);
  const card = frame(`
    <div class="prompt"><span class="tag">${esc(st.zh)}</span> 第 ${step.i + 1} / ${st.pages.length} 頁</div>
    <div class="emoji-big">${pg.e}</div>
    <div class="story">${pg.s.map(([en, zh], k) => `<div class="sline" data-k="${k}"><span class="en">${markVocab(en, vocab)}</span><span class="szh" hidden>${esc(zh)}</span></div>`).join('')}</div>
    <div class="heard" id="tip">點<mark class="vw">畫線的字</mark>可以聽生字</div>
    <div class="row">
      <button class="btn soft small" id="play"><span class="emo">🔊</span> 唸這頁</button>
      <button class="btn soft small" id="slow"><span class="emo">🐢</span> 慢慢唸</button>
      <button class="btn soft small" id="zh">看中文</button>

    ${speakBlock()}

  const lines = [...card.querySelectorAll('.sline')], mic = card.querySelector('#mic'), heard = card.querySelector('#heard'), stars = card.querySelector('#sstars');

  async function read(slow) {
    const my = ++token;

  card.querySelectorAll('.story .vw').forEach(v => v.onclick = e => {

  });
  card.querySelector('#play').onclick = () => read(false);
  card.querySelector('#slow').onclick = () => read(true);

  };
  const said = () => { if (!got) { got = true; gainStar(); mission('saySent'); } };
  heard.textContent = srOff ? '點一句，跟著唸，唸完按 🙋' : '點一句，再按麥克風跟著唸';
  if (srOff) {
    mic.innerHTML = '<span class="emo">🙋</span>';
    mic.setAttribute('aria-label', '我唸好了');
    mic.onclick = () => {
      sfx.yay(); burstAt(mic); heard.textContent = '好勇敢！唸出來就是最棒的！';
      logEvent({ type: 'speak', sid: ses.sid, id: st.id, w: st.title, kind: 'story', mode: 'self' });
      said();
    };
  } else {
    mic.onclick = async () => {
      if (mic.classList.contains('listening')) return;
      stop();
      const target = pg.s[sel][0];
      mic.classList.add('listening'); heard.textContent = '小羊在聽……';
      const r = await listen();
      if (!ses || !document.body.contains(mic)) return;

      const sc = judgeSentence(r.alts, target), n = sc >= .85 ? 3 : sc >= .6 ? 2 : sc >= .3 ? 1 : 0;
      stars.textContent = '⭐'.repeat(n) + '☆'.repeat(3 - n); stars.classList.add('emo');
      heard.innerHTML = `小羊聽到：<span class="en">${esc(r.alts[0] || '')}</span><br><b>${n >= 2 ? '唸得好棒！' : '再聽一次，然後再唸一次！'}</b>`;
      logEvent({ type: 'speak', sid: ses.sid, id: st.id, w: st.title, kind: 'story', ok: n >= 2, stars: n, heard: r.alts[0] || '' });
      if (n >= 2) { sfx.yay(); burstAt(mic, ['🎉', '⭐', '💖', '🎶']); said(); } else sfx.soft();

  setTimeout(() => { if (document.body.contains(card)) read(false); }, 400);
}
// 故事問題：o 的第一個是答案；用假的字（故事編號-q1）記錄有沒有一次答對

// 把一次練習的結果記進進度（正常結束、或下次打開時補記練到一半的那次，都走這裡）
function settle(s) {
  const out = { learned: [], newBadges: [], counted: false, grew: [], chest: 0, rescued: [] };
  if (s.mode === 'rescue') {
    for (const [id, r] of Object.entries(s.res)) {
      const old = S.words[id];
      if (!old || (r.qn || 0) < 2 || !r.first) continue;   // 兩題都答完、都一次答對才算救出
      old.rescued = old.miss || 0;
      S.friends = (S.friends || 0) + 1;
      out.rescued.push(id);
    }
    logEvent({ type: 'rescue', sid: s.sid, tries: Object.keys(s.res).length, got: out.rescued.map(id => BY_ID[id].w).join(' ') });
    if (out.rescued.length) mission('rescue', out.rescued.length);
    return out;
  }
  const t = today();
  for (const [id, r] of Object.entries(s.res)) {
    const old = S.words[id];
    if (!r.review) {
      if (!r.shown) continue;                       // 時間到還沒見到的新字，下次再學
      const box = r.quizzed && r.first ? 2 : 1;     // 只看過沒考到的，明天就複習
      S.words[id] = { box, due: addDays(INTERVAL[box]), seen: 1, miss: r.first ? 0 : 1, first: t };
      out.learned.push(id);
    } else if (old && r.quizzed && r.extra && r.first) {
      old.seen = (old.seen || 0) + 1;               // 多練答對：盒子、複習日期都不動
    } else if (old && r.quizzed) {
      const box = r.first ? Math.min(6, old.box + 1) : 1;
      S.words[id] = Object.assign(old, { box, due: addDays(INTERVAL[box]), seen: (old.seen || 0) + 1, miss: (old.miss || 0) + (r.first ? 0 : 1) });
    }
  }
  for (const u of UNITS) if (!S.badges.includes(u) && unitLeft(u).length === 0) { S.badges.push(u); out.newBadges.push(u); }
  // 練滿 COUNT_MIN 分鐘（或字全部學完）才算今天練過
  const day = today(new Date(s.start));
  out.counted = s.elapsed >= COUNT_MIN * 60000 || !!s.allDone;
  if (out.counted && !S.days.includes(day)) {
    const before = S.days.length;
    S.days.push(day);
    out.grew = ISLAND.filter(x => x[0] > before && x[0] <= S.days.length);
    const st = streak();
    if (MILESTONES.includes(st)) { S.chests.push('super'); out.chest = st; }
  }
  if (out.counted) S.lastStars = s.stars;
  logEvent({ type: 'session', sid: s.sid, minutes: Math.round(s.elapsed / 60000), stars: s.stars, newIds: out.learned, reviewIds: s.reviewIds, badges: out.newBadges, counted: out.counted, partial: !!s.partial });
  return out;
}

function finish() {
  clearInterval(timerId);
  const s = ses; ses = null;
  if (!s) return home();
  S.pending = null;
  const prev = S.lastStars;
  const r = settle(s);

    const st = STORY[s.story];
    const right = Object.values(s.res).filter(x => x.storyQ && x.first).length;
    const rec = S.stories[s.story] || { n: 0, best: 0 }, firstTime = !rec.n;
    rec.n++; rec.best = Math.max(rec.best, right); rec.last = today();
    S.stories[s.story] = rec;
    if (firstTime) S.chests.push('bonus');
    logEvent({ type: 'story', sid: s.sid, got: s.story, first: right, tries: st.qs.length });

  $app.innerHTML = '';
  const card = h(`<section class="card">

    ${r.grew.length ? `<div class="island-box">${islandSvg()}</div>${buddy(`小島長出了 ${r.grew.map(x => `<span class="emo">${x[1]}</span> ${x[2]}`).join('、')}！`, 'wow')}` : ''}
    ${r.counted ? `<div class="pill"><span class="emo">🔥</span> 連續練習 <b>${st}</b> 天</div>` : ''}
    ${r.chest ? buddy(`連續 <b>${r.chest}</b> 天！老虎媽媽送你一個<b>超稀有寶箱</b>！`, 'wow') : ''}
    ${lateShownOn === t && r.counted ? `<div class="buddy">${tiger('happy')}<div class="bubble">這才乖！明天早一點練喔～</div></div>` : ''}
    ${r.newBadges.length ? `<div>${buddy(`拿到新貼紙：${r.newBadges.map(u => `<span class="emo" style="font-size:36px">${unitWords(u)[0].e}</span> <b class="en">NCL4-${u}</b>`).join('、')}`, 'wow')}</div>` : ''}
    <div class="home-actions" id="acts"></div>
  </section>`);
  const acts = card.querySelector('#acts');
  if (canBonus) {

    b.onclick = () => { sfx.tap(); bonusRun(r.learned.concat(s.reviewIds)); };
    acts.appendChild(b);

/* ---------- 寶箱 ----------
   kind = 'bonus'：獎勵關終點，開普通或稀有的；'super'：連續天數送的，開超稀有
   kind = null：打開排隊中的寶箱 */
function openChest(kind, after = home) {
  if (!kind) { kind = S.chests.shift() || 'bonus'; save(); }
  const pool = ITEMS.filter(x => !S.owned.includes(x.id) && (kind === 'super' ? x.r === 's' : !x.chest));
  const item = pool.length ? pick(pool) : null;
  const extra = kind === 'super' ? 30 : 15;   // 衣櫥都拿齊了就改送星星
  const m = h(`<div class="overlay">
    <div class="chest" role="button" aria-label="打開寶箱">🎁</div>
    <div class="bubble">${kind === 'super' ? '超稀有寶箱！' : '寶箱！'}碰一下打開～</div>
  </div>`);
  document.body.appendChild(m);
  let opened = false;
  m.querySelector('.chest').onclick = () => {
    if (opened) return;
    opened = true; sfx.tap();
    m.querySelector('.chest').classList.add('shake');
    setTimeout(() => {
      if (item) S.owned.push(item.id); else S.stars += extra;
      save();
      logEvent({ type: 'chest', kind, got: item ? item.id : 'stars+' + extra }); flush();
      const close = () => { m.remove(); after(); };
      m.innerHTML = '';
      const c = h(`<section class="card">
        ${item
          ? `<div class="prize">${item.e}</div><span class="rar ${item.r}">${RARITY[item.r]}</span><h2 style="margin:0">${item.name}</h2>
             <div class="wardrobe-lamb">${lamb('cheer', Object.assign({}, S.wear, { [item.slot]: item.id }))}</div>`
          : `<div class="prize">⭐</div><h2 style="margin:0">得到 ${extra} 顆星星！</h2><div class="heard">衣櫥裡的東西都拿到了，好厲害！</div>`}
        <div class="row" id="acts"></div>
      </section>`);
      const acts = c.querySelector('#acts');
      if (item) {
        const wearIt = h(`<button class="btn">穿上它！<span class="emo">✨</span></button>`);
        wearIt.onclick = () => { sfx.tap(); S.wear[item.slot] = item.id; save(); close(); };
        const keepIt = h(`<button class="btn soft small">先收進衣櫥</button>`);
        keepIt.onclick = () => { sfx.tap(); close(); };

    }, 1000);
  };
}

/* ---------- 獎勵關：小羊跑酷 ----------
   每天練滿才開一次。障礙物跑過來時出一題，選對意思小羊就跳過去，沒有失敗，跑到終點開寶箱 */
function bonusRun(pool) {
  S.bonusOn = today(); save();
  let ids = [...new Set(pool)].filter(id => BY_ID[id]);
  for (const id of shuffle(Object.keys(S.words))) { if (ids.length >= RUN_N) break; if (BY_ID[id] && !ids.includes(id)) ids.push(id); }
  for (const w of shuffle(W)) { if (ids.length >= RUN_N) break; if (!ids.includes(w.id)) ids.push(w.id); }
  ids = shuffle(ids).slice(0, RUN_N);
  const OBS = ['🍄', '🪨', '🌵', '📦', '⛄'];
  $app.innerHTML = '';
  $app.appendChild(backBar('獎勵關'));
  const card = h(`<section class="card">
    <div class="prompt"><span class="tag">獎勵關</span> 答對就跳過去，跑到終點開寶箱！</div>
    <div class="runner">
      <span class="run-cloud" style="left:12%;top:16px">☁️</span><span class="run-cloud" style="left:64%;top:38px">☁️</span>
      <div class="run-ground"></div>
      <div class="run-lamb">${lamb('smile')}</div>
      <div class="run-ob"></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="run-q" id="q"></div>
  </section>`);
  $app.appendChild(card);
  const runner = card.querySelector('.runner'), ob = card.querySelector('.run-ob'), lambEl = card.querySelector('.run-lamb');
  const q = card.querySelector('#q'), dots = card.querySelector('#dots');
  let k = 0, firsts = 0;
  const alive = () => document.body.contains(card);   // 中途按回首頁就停
  function approach(e, stopAt, then) {
    ob.style.transition = 'none'; ob.style.left = '105%'; ob.textContent = e; void ob.offsetWidth;
    runner.classList.add('running');
    ob.style.transition = 'left 1.5s linear'; ob.style.left = stopAt;
    setTimeout(() => { if (!alive()) return; runner.classList.remove('running'); then(); }, 1500);
  }
  function step() {
    dots.textContent = ids.map((_, i) => i < k ? '⭐' : i === k ? '🐑' : '⚪').join('');
    if (k >= ids.length) return goal();
    approach(OBS[k % OBS.length], '42%', ask);
  }
  function ask() {
    const w = BY_ID[ids[k]];
    q.innerHTML = `<div class="row"><div class="word" style="font-size:clamp(36px,7vw,56px)">${esc(w.w)}</div>
      <button class="icon-btn" id="sp" aria-label="聽發音"><span class="emo">🔊</span></button></div>
      <div class="choices"></div><div class="heard" id="msg">選對意思，小羊就會跳起來！</div>`;
    q.querySelector('#sp').onclick = () => say(w.w);
    say(w.w);
    const box = q.querySelector('.choices');
    let tries = 0, done = false;
    for (const o of shuffle([w.g, distractors(w, 1, 'g')[0]])) {
      const b = h(`<button class="choice">${esc(o)}</button>`);
      b.onclick = () => {
        if (done) return;
        tries++;
        if (o === w.g) {
          done = true; b.classList.add('right'); sfx.yay();
          if (tries === 1) { firsts++; S.stars++; save(); }
          jump();
        } else {
          sfx.soft(); wiggle(b); b.classList.add('tried');
          [...box.children].find(x => x !== b).classList.add('glow');
          q.querySelector('#msg').textContent = '答案在發亮的地方喔！';
        }
      };
      box.appendChild(b);
    }
  }
  function jump() {
    lambEl.classList.remove('jump'); void lambEl.offsetWidth; lambEl.classList.add('jump');
    runner.classList.add('running');
    ob.style.transition = 'left .9s linear'; ob.style.left = '-20%';
    setTimeout(() => { if (!alive()) return; lambEl.classList.remove('jump'); k++; q.innerHTML = ''; step(); }, 950);
  }
  function goal() {
    approach('🏁', '58%', () => {
      sfx.fanfare(); burstAt(runner, ['🎉', '⭐', '🏁', '💖']);
      logEvent({ type: 'bonus', first: firsts, tries: ids.length, stars: firsts }); flush();
      mission('bonus');
      q.innerHTML = buddy(`跑到終點了！一次答對 <b>${firsts}</b> 題，得到 <span class="emo">⭐</span> ${firsts}！`, 'cheer');
      const b = h(`<button class="btn big butter">打開寶箱 <span class="emo">🎁</span></button>`);
      b.onclick = () => { sfx.tap(); openChest('bonus', home); };
      q.appendChild(b);
    });
  }
  step();
}
