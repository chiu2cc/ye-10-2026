    <div class="island-box talkable">${islandSvg()}<button class="lamb-hit" aria-label="跟小羊說話"></button></div>
    <div class="bubble talk" id="talk">點一下小羊，牠會跟你說英文喔！</div>
    ${buddy(days ? `小島已經蓋了 <b>${days}</b> 天！每天練滿 ${COUNT_MIN} 分鐘，小島就會慢慢長出新東西。` : `今天練滿 ${COUNT_MIN} 分鐘，小島就會開始長草喔！`, 'smile')}
    ${have.length ? `<div class="learned">${have.map(x => `<span><i class="emo">${x[1]}</i> ${x[2]}</span>`).join('')}</div>` : ''}
    ${soon.length ? `<div class="heard">接下來：${soon.map(x => `第 <b class="en">${x[0]}</b> 天 <span class="emo">❓</span>`).join('　')}</div>` : ''}
    <div class="heard">${pets.length ? `住在島上的小動物：<span class="friends">${pets.join('')}</span>` : '去救援站救小動物，牠們會搬來小島住！'}</div>
  </section>`);
  let last = -1;
  card.querySelector('.lamb-hit').onclick = () => {
    const lines = lambLines();
    let i = rnd(lines.length); if (i === last) i = (i + 1) % lines.length; last = i;
    const [en, zh] = lines[i];
    const t = card.querySelector('#talk');
    t.innerHTML = `<span class="en">${esc(en)}</span>${esc(zh)}`;
    t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop');
    say(en);
    logEvent({ type: 'talk', got: en });
  };
  $app.appendChild(card);
}

// 單字圖鑑：學過的字都是一張卡，複習到第 4 盒以上（連續答對、間隔兩週）變金卡
let dexFilter = 'all';
function dexView() {
  $app.innerHTML = '';
  $app.appendChild(backBar('單字圖鑑'));
  const mine = ALLW.filter(w => S.words[w.id]), gold = w => S.words[w.id].box >= 4;
  const g = mine.filter(gold).length;
  const list = dexFilter === 'gold' ? mine.filter(gold) : dexFilter === 'plain' ? mine.filter(w => !gold(w)) : mine;
  const tabs = [['all', `全部 ${mine.length}`], ['gold', `金卡 ${g}`], ['plain', `還不是金卡 ${mine.length - g}`]];
  const card = h(`<section class="card ${dexFilter === 'all' ? '' : 'still'}">
    ${buddy(mine.length ? `收集了 <b>${mine.length}</b> 張卡片，其中 <b>${g}</b> 張是金卡！<br>複習的時候一直答對，卡片就會變成金色。點卡片可以聽發音。`
      : '還沒有卡片，開始練習就會收集到喔！', 'smile')}
    <div class="tabs">${tabs.map(([k, n]) => `<button class="tab ${k === dexFilter ? 'on' : ''}" data-k="${k}">${n}</button>`).join('')}</div>
    <div class="dex">${list.map(w => `<button class="dexcard ${gold(w) ? 'gold' : ''}" data-id="${w.id}"><span class="emo">${w.e}</span><b>${esc(w.w)}</b><span>${esc(w.g)}</span></button>`).join('')}</div>
  </section>`);
  card.querySelectorAll('.tab').forEach(b => b.onclick = () => { sfx.tap(); dexFilter = b.dataset.k; dexView(); });
  card.querySelectorAll('.dexcard').forEach(b => b.onclick = () => say(BY_ID[b.dataset.id].w));
  $app.appendChild(card);
}

// 媽媽兌換券：用星星換，換到的券拿給媽媽看就能兌現
function couponView() {
  $app.innerHTML = '';
  $app.appendChild(backBar('媽媽兌換券'));
  const mine = S.coupons.slice(-5).reverse();
  const md = s => { const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const card = h(`<section class="card">
    ${buddy('存夠星星就能換！換好之後拿給媽媽看，就能兌現喔～', 'cheer')}
    <div class="star-count"><span class="emo">⭐</span><b>${S.stars}</b></div>
    <div class="coupons"></div>
    ${mine.length ? `<div class="heard">換過的券：${mine.map(c => `${md(c.at)} <span class="emo">${esc(c.e || '🎟️')}</span> ${esc(c.name)}`).join('　')}</div>` : ''}
  </section>`);
  const box = card.querySelector('.coupons');
  for (const c of coupons()) {
    const short = S.stars < c.stars;
    const b = h(`<button class="coupon ${short ? 'short' : ''}"><span class="emo">${esc(c.e || '🎟️')}</span>
      <div><b>${esc(c.name)}</b><span class="price">⭐ ${c.stars}${short ? `　還差 ${c.stars - S.stars}` : ''}</span></div></button>`);
    b.onclick = () => {
      if (short) { wiggle(b); sfx.soft(); return; }
      sfx.tap(); redeem(c);
    };
    box.appendChild(b);
  }
  $app.appendChild(card);
}
function redeem(c) {
  const m = h(`<div class="overlay"><section class="card">
    ${buddy(`要用 <b>${c.stars}</b> 顆星星，換「<b>${esc(c.name)}</b>」嗎？`, 'think')}
    <div class="row"><button class="btn butter" id="yes">換！<span class="emo">${esc(c.e || '🎟️')}</span></button><button class="btn soft small" id="no">再想想</button></div>
  </section></div>`);
  document.body.appendChild(m);
  m.querySelector('#no').onclick = () => { sfx.tap(); m.remove(); };
  m.querySelector('#yes').onclick = () => {
    if (S.stars < c.stars) { m.remove(); return; }
    S.stars -= c.stars;
    const at = new Date().toISOString();
    S.coupons.push({ name: c.name, e: c.e, stars: c.stars, at }); save();
    logEvent({ type: 'redeem', got: c.name, tries: c.stars }); flush();
    sfx.fanfare();
    const d = new Date(at);
    m.innerHTML = '';
    const t = h(`<section class="card"><div class="ticket">
      <span class="emo">${esc(c.e || '🎟️')}</span><h2>${esc(c.name)}</h2>
      <div class="heard">${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}　${NAME}用 ⭐${c.stars} 換到的</div>
    </div>${buddy('拿給媽媽看，就能兌現喔！', 'cheer')}<button class="btn" id="ok">好！</button></section>`);
    t.querySelector('#ok').onclick = () => { sfx.tap(); m.remove(); couponView(); };
    m.appendChild(t);
    burst(innerWidth / 2, innerHeight / 3, ['🎉', '⭐', '💖', '🎟️']);
  };
}

// 媽媽的信：試算表 message 分頁 A2 的內容；改了內容，陽寶下次打開就會收到
function showLetter(isNew) {
  if (!REMOTE.message || document.querySelector('.overlay, .tiger-mask')) return;
  const m = h(`<div class="overlay">
    <div class="envelope" role="button" aria-label="打開信">💌</div>
    <div class="bubble">${isNew ? '小羊送來一封媽媽的信！' : '媽媽的信'}碰一下打開～</div>
  </div>`);
  document.body.appendChild(m);
  m.querySelector('.envelope').onclick = () => {
    sfx.yay();
    m.innerHTML = '';
    const c = h(`<section class="card">${lamb('cheer').replace('<svg ', '<svg width="110" height="110" ')}
      <h2 style="margin:0">給${NAME}的信</h2><div class="letter">${esc(REMOTE.message)}</div>
      <button class="btn" id="ok">收到了 <span class="emo">💖</span></button></section>`);
    c.querySelector('#ok').onclick = () => {
      sfx.tap();
      if (S.msgSeen !== REMOTE.message) { S.msgSeen = REMOTE.message; save(); logEvent({ type: 'letter', got: 'read' }); }
      m.remove();
    };
    m.appendChild(c);
  };
}

// 同步狀態（給大人看）：還有幾筆沒送、最近每次送資料的結果
function syncView() {
  $app.innerHTML = '';
  $app.appendChild(backBar('同步狀態'));
  const fmt = s => { const d = new Date(s); const z = n => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`; };
  const why = r => r.startsWith('ok') ? '送到了' : r.startsWith('net') ? '連不上（網路被擋或沒網路）' : '試算表回覆有問題';
  const log = (S.syncLog || []).slice().reverse();
  let host = ''; try { host = new URL(CFG.progressUrl).host; } catch (e) {}
  const card = h(`<section class="card" style="text-align:left;align-items:stretch">
    <div class="pill" style="align-self:center">${syncLabel()}</div>
    <div class="heard">這台裝置：<span class="en">${esc(S.device)}</span>　送到：<span class="en">${esc(host || '（沒有設定）')}</span><br>
      進度：練習 ${S.days.length} 天、學過 ${Object.keys(S.words).length} 個字</div>
    <div class="row"><button class="btn mint small" id="send">再送一次</button><button class="btn soft small" id="test">測試連線</button></div>
    <div class="heard" id="out"></div>
    <div class="missions"><h3>最近 ${log.length} 次送資料</h3>
      ${log.length ? log.map(x => `<div class="mis"><span class="en" style="min-width:96px">${fmt(x.at)}</span><span>${why(x.res)}</span>
        <span class="cnt" style="flex:1;text-align:left;font-size:14px;color:var(--ink-soft)">${esc(x.res)}</span></div>`).join('') : '<div class="mis">還沒有送過</div>'}
    </div>
  </section>`);
  const out = card.querySelector('#out');
  card.querySelector('#send').onclick = async () => { sfx.tap(); out.textContent = '送出中……'; await flush(true); syncView(); };
  card.querySelector('#test').onclick = async () => {
    sfx.tap(); out.textContent = '測試中……';
    try {
      const r = await fetch(`${CFG.progressUrl}?action=hello&key=${encodeURIComponent(CFG.key)}`);
      const t = await r.text();
      out.textContent = `讀取：HTTP ${r.status}　${t.slice(0, 80)}`;
    } catch (e) { out.textContent = '讀取失敗：' + String((e && e.message) || e); }
  };
  $app.appendChild(card);
}

function storyView() {
  $app.innerHTML = '';
  $app.appendChild(backBar('故事屋'));
  if (!STORIES.length) return storyLock();
  const card = h(`<section class="card">
    ${buddy('選一本故事書！先認識生字，再聽故事、跟著唸，最後回答問題。<br>第一次讀完一本，就送你一個寶箱～', 'cheer')}
    <div class="shelf"></div>
  </section>`);
  const box = card.querySelector('.shelf');
  for (const st of STORIES) {
    const rec = S.stories[st.id], learned = st.ids.filter(id => S.words[id]).length;
    const b = h(`<button class="book ${rec ? 'done' : ''}"><span class="emo">${st.e}</span><div>
      <b class="en">${esc(st.title)}</b><span>${esc(st.zh)}</span>
      <span class="state">${rec ? `<span class="emo">✅</span> 讀過 ${rec.n} 次・答對 ${rec.best}/${st.qs.length}` : `生字 ${learned}/${st.ids.length}・${st.pages.length} 頁`}</span></div></button>`);
    b.onclick = () => { pickVoice(); startStory(st.id); };
    box.appendChild(b);
  }
  $app.appendChild(card);
}

// 故事屋上鎖：請大人輸入一次密碼，之後這台平板會記住
function storyLock() {
  const card = h(`<section class="card">
    ${buddy('故事屋上鎖了！<br>請爸爸或媽媽輸入密碼（只要輸入一次）。', 'think')}
    <input class="pass" id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="故事屋密碼">
    <button class="btn" id="open">打開故事屋 <span class="emo">🔑</span></button>
    <div class="heard" id="msg"></div>
  </section>`);
  const pw = card.querySelector('#pw'), btn = card.querySelector('#open'), msg = card.querySelector('#msg');
  const go = async () => {
    if (!pw.value.trim()) return;
    btn.disabled = true; msg.textContent = '開鎖中……';
    if (await unlockStories(pw.value.trim())) { sfx.fanfare(); storyView(); return; }
    btn.disabled = false; sfx.soft(); wiggle(pw); msg.textContent = '密碼不對，再試一次';
  };
  btn.onclick = go;
  pw.onkeydown = e => { if (e.key === 'Enter') go(); };
  $app.appendChild(card);
  pw.focus();
}

function rescueView() {
  $app.innerHTML = '';
  $app.appendChild(backBar('救援站'));
  const list = rescueList();
  const pets = FRIENDS.slice(0, Math.min(S.friends || 0, FRIENDS.length));
  const card = h(`<section class="card">
    ${list.length
      ? buddy(`有 <b>${list.length}</b> 個比較難的字，小動物被困在裡面了！<br>每個字考兩題，兩題都一次答對，就能救出一隻小動物，牠會搬到你的小島上。`, 'think')
      : buddy('現在沒有需要救援的字，太厲害了！<br>練習時答錯過的字會跑來這裡。', 'cheer')}
    ${list.length ? `<div class="cages">${list.slice(0, MAX_RESCUE).map(id => `<div class="cage"><span class="emo">🔒</span><b class="en">${esc(BY_ID[id].w)}</b></div>`).join('')}</div>` : ''}
    <div class="heard">${pets.length ? `已經救出：<span class="friends">${pets.join('')}</span>` : '還沒有救出小動物'}</div>
  </section>`);
  if (list.length) {
    const b = h(`<button class="btn big">出發救援 <span class="emo">🚑</span></button>`);
    b.onclick = () => { pickVoice(); startSession('rescue'); };
    card.appendChild(b);
  }
  $app.appendChild(card);
}
function rescueResult(r) {
  const n = r.rescued.length, total = S.friends || 0;
  const pets = Array.from({ length: n }, (_, i) => FRIENDS[(total - n + i) % FRIENDS.length]);   // 超過 16 隻就輪回來
  $app.innerHTML = '';
  const card = h(`<section class="card">
    <div class="hero">${lamb('cheer')}<h1>${n ? `救出 ${n} 隻小動物！` : '大家都很努力！'}</h1></div>
    ${pets.length ? `<div class="friends" style="font-size:52px">${pets.join('')}</div>` : ''}
    ${n ? `<div class="learned">${r.rescued.map(id => `<span><i class="emo">${BY_ID[id].e}</i> ${esc(BY_ID[id].w)}</span>`).join('')}</div>` : ''}
    ${buddy(rescueList().length ? '還有小動物在等你，下次再來救牠們！' : '全部救出來了，好厲害！', 'smile')}
    <div class="home-actions" id="acts"></div>
  </section>`);
  const go = h(`<button class="btn big">去小島看看 <span class="emo">🏝️</span></button>`);
  go.onclick = () => { sfx.tap(); islandView(); };
  const back = h(`<button class="btn soft">回首頁</button>`);
  back.onclick = () => { sfx.tap(); home(); };
  card.querySelector('#acts').append(go, back);
  $app.appendChild(card);
  if (n) { sfx.fanfare(); setTimeout(() => burst(innerWidth / 2, innerHeight / 3, pets.concat(['💖', '✨'])), 150); }
}
function bookView() {
  $app.innerHTML = '';
  $app.appendChild(backBar('貼紙簿'));
  const card = h(`<section class="card">${buddy(`學完一個單元就能貼一張貼紙！已經有 <b>${S.badges.length}</b> 張囉。`, 'smile')}<div class="grid"></div></section>`);
  const g = card.querySelector('.grid');
  for (const u of UNITS) {
    g.appendChild(S.badges.includes(u)
      ? h(`<div class="sticker">${unitWords(u)[0].e}<small>${u}</small></div>`)
      : h(`<div class="sticker empty">${u}</div>`));
  }
  $app.appendChild(card);
}

/* ---------- 開始 ---------- */
restoreIfEmpty().then(loadStories).then(() => {
  // 上次練到一半就關掉：先把那次學過的字補記起來
  if (S.pending) { const p = S.pending; S.pending = null; settle(p); save(); }
  home();
  flush(true);   // 一打開就把整份進度送一次（就算沒有新紀錄），平板上的進度才救得回來
  // 兌換券和媽媽的信放在試算表；先用上次存的畫首頁，抓到新的信再重畫
  const before = REMOTE.message;
  loadRemote().then(() => {
    if (REMOTE.message !== before && !ses && document.getElementById('go') && lateShownOn !== today()) home();
  });
  // 大人試看用：網址加 #tiger 或 #idle
  if (location.hash === '#tiger') showLateTiger();
  if (location.hash === '#idle') setTimeout(showIdleTiger, 300);
});
window.addEventListener('online', flush);
// 離線也打得開：sw.js 一律先抓網路上的新版，抓不到才用存在平板上的
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
