<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFE9DC">
<title>陽寶的英文小島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Color+Emoji&display=swap">
<style>
:root {
  --sky: #FFE9DC;        /* 蜜桃底 */
  --paper: #FFFBF6;      /* 卡片 */
  --ink: #5B3B31;        /* 可可色字 */
  --ink-soft: #9A7568;
  --cocoa-light: #B07A5A;
  --cocoa: #85563E;
  --cream: #F7E4CF;
  --pink: #FF8FAB;
  --pink-deep: #E86A8A;
  --mint: #7FD6C2;
  --mint-deep: #4DB59D;
  --water: #A9E3F0;
  --water-deep: #6CC4DA;
  --butter: #FFD45E;
  --butter-deep: #E8B530;
  --lilac: #C9B6F2;
  --line: #F1D9CB;
  --font-en: "Fredoka", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  --font-zh: "LXGW WenKai TC", "jf-openhuninn", "Microsoft JhengHei", "PingFang TC", sans-serif;
  --font-emoji: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font-family: var(--font-zh);
  font-size: 20px;
  line-height: 1.5;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
}
body::after { /* 底部的小波浪 */
  content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 90px; z-index: 0; pointer-events: none;
  background:
    radial-gradient(40px 22px at 40px 0, transparent 98%, var(--water) 100%) 0 0/80px 40px repeat-x,
    linear-gradient(var(--water), var(--water)) 0 40px/100% 50px no-repeat;
  opacity: .55;
}
.en { font-family: var(--font-en); }
.emo { font-family: var(--font-emoji); font-style: normal; }
#app {
  position: relative; z-index: 1;
  max-width: 860px; margin: 0 auto;
  min-height: 100%;
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 100px);
  display: flex; flex-direction: column; gap: 16px;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--water-deep); outline-offset: 3px; }

/* ---------- 按鈕 ---------- */
.btn {
  --bg: var(--pink); --edge: var(--pink-deep); --fg: #fff;
  min-height: 64px; padding: 10px 28px; border-radius: 24px;
  background: var(--bg); color: var(--fg);
  box-shadow: 0 6px 0 var(--edge);
  font-family: var(--font-zh); font-size: 26px; font-weight: 700; letter-spacing: .04em;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--edge); }
.btn.mint { --bg: var(--mint); --edge: var(--mint-deep); }
.btn.butter { --bg: var(--butter); --edge: var(--butter-deep); --fg: var(--ink); }
.btn.soft { --bg: #fff; --edge: var(--line); --fg: var(--ink); }
.btn.big { min-height: 84px; font-size: 32px; padding-inline: 44px; border-radius: 30px; }
.btn.small { min-height: 52px; font-size: 20px; padding-inline: 18px; border-radius: 18px; box-shadow: 0 4px 0 var(--edge); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn {
  width: 60px; height: 60px; border-radius: 50%;
  background: #fff; box-shadow: 0 4px 0 var(--line);
  display: inline-grid; place-items: center; font-size: 28px; flex: none;
}
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

/* ---------- 頂列 ---------- */
.topbar { display: flex; align-items: center; gap: 12px; }
.river {
  position: relative; flex: 1; height: 26px; border-radius: 13px;
  background: #fff; box-shadow: inset 0 0 0 3px var(--line); overflow: visible;
}
.river-fill {
  position: absolute; inset: 3px auto 3px 3px; border-radius: 10px;
  background: repeating-linear-gradient(-45deg, var(--water) 0 10px, #BDEBF4 10px 20px);
  width: 0; transition: width 1s linear;
}
.river-lamb {
  position: absolute; top: 50%; left: 0; width: 48px; height: 48px;
  transform: translate(-50%, -54%); transition: left 1s linear;
}
.star-count {
  flex: none; display: flex; align-items: center; gap: 4px;
  background: #fff; border-radius: 20px; padding: 6px 14px; box-shadow: 0 4px 0 var(--line);
  font-family: var(--font-en); font-weight: 600; font-size: 24px;
}

/* ---------- 卡片 ---------- */
.card {
  background: var(--paper); border-radius: 32px; padding: 28px 24px;
  box-shadow: 0 10px 0 var(--line), 0 18px 40px rgba(176, 122, 90, .12);
  display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
}
@media (max-height: 860px) and (orientation: landscape) {
  .card { padding-block: 18px; gap: 10px; }
  .emoji-big { font-size: 64px; }
  .mic { width: 104px; height: 104px; font-size: 44px; }
}
.prompt { font-size: 24px; color: var(--ink-soft); display: flex; align-items: center; gap: 10px; }
.prompt .tag {
  font-size: 18px; padding: 2px 12px; border-radius: 12px; background: var(--cream); color: var(--cocoa);
}
.word { font-family: var(--font-en); font-weight: 600; font-size: clamp(44px, 9vw, 72px); line-height: 1.1; color: var(--ink); overflow-wrap: anywhere; }
.gloss { font-size: 30px; font-weight: 700; color: var(--cocoa); }
.emoji-big { font-family: var(--font-emoji); font-size: 84px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.06)); }
.sentence { font-family: var(--font-en); font-size: clamp(24px, 4.2vw, 32px); line-height: 1.45; max-width: 30ch; }
.sentence mark { background: linear-gradient(transparent 55%, #FFE07A 55%); color: inherit; padding: 0 2px; border-radius: 4px; }
.zh { font-size: 24px; color: var(--ink-soft); }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }

/* 選擇題 */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
.choices.one { grid-template-columns: 1fr; }
@media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
.choice {
  min-height: 76px; padding: 12px 16px; border-radius: 22px;
  background: #fff; box-shadow: 0 6px 0 var(--line), inset 0 0 0 3px var(--line);
  font-size: 26px; font-weight: 700; line-height: 1.3;
  transition: transform .08s, opacity .3s, background .2s;
}
.choice.en { font-family: var(--font-en); font-weight: 500; font-size: 30px; }
.choice.long { font-size: 22px; font-weight: 400; text-align: left; }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line), inset 0 0 0 3px var(--line); }
.choice.right { background: #E2F8F1; box-shadow: 0 6px 0 var(--mint-deep), inset 0 0 0 3px var(--mint); }
.choice.tried { opacity: .38; pointer-events: none; }
.choice.glow { animation: glow 1s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 6px 0 var(--butter-deep), inset 0 0 0 4px var(--butter); } }

/* 拼字 */
.slots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.slot {
  width: 54px; height: 64px; border-radius: 16px; background: #fff;
  box-shadow: inset 0 0 0 3px var(--line); display: grid; place-items: center;
  font-family: var(--font-en); font-weight: 600; font-size: 36px;
}
.slot.filled { box-shadow: inset 0 0 0 3px var(--water-deep); background: #EEFAFD; }
.slot.locked { box-shadow: inset 0 0 0 3px var(--butter-deep); background: #FFF6D8; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 640px; }
.tile {
  width: 60px; height: 64px; border-radius: 18px; background: var(--water);
  box-shadow: 0 5px 0 var(--water-deep); font-family: var(--font-en); font-weight: 600; font-size: 34px; color: var(--ink);
}
.tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--water-deep); }
.tile.used { visibility: hidden; }
.tile.hint { animation: glow-tile .7s ease-in-out infinite alternate; }
@keyframes glow-tile { to { background: var(--butter); box-shadow: 0 5px 0 var(--butter-deep); } }

/* 排句子 */
.answer-line {
  min-height: 76px; width: 100%; border-radius: 20px; padding: 10px;
  background: #fff; box-shadow: inset 0 0 0 3px var(--line);
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;
}
.chip {
  padding: 8px 16px; border-radius: 16px; background: var(--lilac); box-shadow: 0 4px 0 #A994DB;
  font-family: var(--font-en); font-size: 26px; font-weight: 500;
}
.chip.placed { background: #EEE7FF; box-shadow: 0 3px 0 #D3C6F5; }
.chip.used { visibility: hidden; }

/* 說說看 */
.mic {
  width: 132px; height: 132px; border-radius: 50%;
  background: var(--pink); box-shadow: 0 8px 0 var(--pink-deep);
  font-size: 56px; display: grid; place-items: center; color: #fff;
}
.mic:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--pink-deep); }
.mic.listening { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 8px 0 var(--pink-deep), 0 0 0 18px rgba(255,143,171,.25); } }
.heard { font-size: 20px; color: var(--ink-soft); min-height: 30px; }
.heard .en { color: var(--ink); }
.stars-row { font-size: 44px; letter-spacing: 6px; min-height: 56px; }

/* 吉祥物對話 */
.buddy { display: flex; align-items: flex-end; gap: 10px; }
.buddy svg { width: 96px; height: 96px; flex: none; }
.bubble {
  position: relative; background: #fff; border-radius: 22px; padding: 12px 18px;
  box-shadow: 0 4px 0 var(--line); font-size: 22px; text-align: left; max-width: 520px;
}
.bubble::before {
  content: ""; position: absolute; left: -10px; bottom: 18px; border: 10px solid transparent; border-right-color: #fff; border-left: 0;
}

/* 首頁 */
.hero { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 8px; }
.hero svg { width: 170px; height: 170px; }
.hero h1 { margin: 0; font-size: clamp(30px, 6vw, 42px); text-wrap: balance; }
.plan { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; }
@media (max-width: 560px) { .plan { grid-template-columns: 1fr; } }
.plan-item { background: #fff; border-radius: 24px; padding: 16px 18px; box-shadow: 0 5px 0 var(--line); text-align: left; display: flex; gap: 14px; align-items: center; }
.plan-item .emo { font-size: 40px; }
.plan-item b { display: block; font-size: 24px; }
.plan-item span { color: var(--ink-soft); font-size: 18px; }
.home-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.meta-row { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; color: var(--ink-soft); font-size: 18px; }

/* 單元與貼紙 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; width: 100%; }
.unit {
  border-radius: 20px; background: #fff; box-shadow: 0 4px 0 var(--line), inset 0 0 0 3px var(--line);
  padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.unit .num { font-family: var(--font-en); font-weight: 600; font-size: 22px; }
.unit .sub { font-size: 15px; color: var(--ink-soft); font-family: var(--font-en); }
.unit.cur { box-shadow: 0 4px 0 var(--pink-deep), inset 0 0 0 3px var(--pink); }
.unit.done { background: #FFF6D8; }
.sticker { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-emoji); font-size: 40px;
  background: #fff; box-shadow: 0 4px 0 var(--line); position: relative; }
.sticker small { position: absolute; bottom: -6px; font-family: var(--font-en); font-size: 13px; background: var(--butter); border-radius: 8px; padding: 0 6px; color: var(--ink); }
.sticker.empty { background: transparent; box-shadow: none; border: 3px dashed var(--line); font-size: 20px; color: var(--line); }

/* 結算 */
.result-stats { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.stat { background: #fff; border-radius: 22px; padding: 12px 20px; box-shadow: 0 4px 0 var(--line); min-width: 130px; }
.stat b { display: block; font-family: var(--font-en); font-size: 40px; font-variant-numeric: tabular-nums; }
.learned { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.learned span { background: #fff; border-radius: 14px; padding: 4px 12px; box-shadow: 0 3px 0 var(--line); font-family: var(--font-en); font-size: 20px; }

.banner {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 80px); transform: translateX(-50%);
  z-index: 20; background: var(--butter); border-radius: 20px; padding: 10px 22px; box-shadow: 0 5px 0 var(--butter-deep); font-size: 22px; font-weight: 700;
}

/* 彩帶 */
.burst { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.burst i { position: absolute; font-style: normal; font-family: var(--font-emoji); font-size: 30px; animation: fly 1.1s ease-out forwards; }
@keyframes fly {
  from { transform: translate(0, 0) scale(.4) rotate(0); opacity: 1; }
  to { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; }
}
.wiggle { animation: wiggle .45s; }
@keyframes wiggle { 20%, 60% { transform: translateX(-8px) rotate(-1deg); } 40%, 80% { transform: translateX(8px) rotate(1deg); } }
.pop { animation: pop .4s; }
@keyframes pop { 40% { transform: scale(1.12); } }
/* 老虎媽媽 */
.tiger-mask {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(28, 12, 6, .84);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding-inline: 16px; text-align: center;
}
.tiger-mask svg { width: min(300px, 62vw); height: auto; filter: drop-shadow(0 10px 30px rgba(255, 120, 40, .45)); }
.tiger-mask .bubble { font-size: clamp(24px, 4.4vw, 34px); font-weight: 700; max-width: 640px; text-align: center; }
.tiger-mask .bubble::before { display: none; }
.tiger-mask .anger { position: absolute; font-family: var(--font-emoji); font-size: 56px; transform: translate(110px, -150px); }
.tiger-mask .tap { color: #FFD9C2; font-size: 20px; }
.tiger-peek {
  position: fixed; right: 12px; bottom: 0; z-index: 25;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  animation: peek-up .35s ease-out;
}
.tiger-peek svg { width: 150px; height: 150px; margin-bottom: -26px; }
.tiger-peek .bubble { font-size: 22px; font-weight: 700; }
.tiger-peek .bubble::before { display: none; }
@keyframes peek-up { from { transform: translateY(100%); } }
.quake { animation: quake .12s linear infinite; }
@keyframes quake {
  0% { transform: translate(0, 0); } 25% { transform: translate(-6px, 3px); }
  50% { transform: translate(5px, -4px); } 75% { transform: translate(-4px, -2px); } 100% { transform: translate(0, 0); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script src="config.js"></script>
<script src="words.js"></script>
<script>
'use strict';
/* =========================================================
   陽寶的英文小島：Level 4 生字練習
   - 每次 15 分鐘：先複習到期的字，再學新字
   - 間隔複習（盒子 1~6，間隔 1/3/7/14/30/60 天）
   - 進度存平板 localStorage，並送到 Google Apps Script（config.js）
   ========================================================= */
const W = window.WORDS;
const BY_ID = Object.fromEntries(W.map(x => [x.id, x]));
const UNITS = [...new Set(W.map(x => x.u))];
const SESSION_MIN = 15;
const NEW_BATCH = 6;
const MAX_REVIEW = 8;
const INTERVAL = [0, 1, 3, 7, 14, 30, 60];
const NAME = '陽寶';
const CFG = window.YB_CONFIG || {};
const LS_KEY = 'yangbao-l4-v1';
const $app = document.getElementById('app');

/* ---------- 小工具 ---------- */
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[rnd(a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = (d = new Date()) => { const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return today(d); };
const norm = s => s.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* ---------- 狀態 ---------- */
function blankState() { return { words: {}, stars: 0, badges: [], days: [], curUnit: UNITS[0], outbox: [], device: uid() }; }
let S = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.words) return Object.assign(blankState(), s); } catch (e) {}
  return blankState();
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- 進度回傳 ---------- */
function logEvent(ev) { S.outbox.push(Object.assign({ ts: new Date().toISOString() }, ev)); save(); }
async function flush() {
  if (!CFG.progressUrl || !S.outbox.length) return;
  const batch = S.outbox.slice();
  const snapshot = Object.assign({}, S, { outbox: [] });
  const body = JSON.stringify({ key: CFG.key, device: S.device, events: batch, state: snapshot });
  let sent = false;
  try {
    const r = await fetch(CFG.progressUrl, { method: 'POST', body });
    sent = r.ok;
  } catch (e) {
    try { await fetch(CFG.progressUrl, { method: 'POST', body, mode: 'no-cors' }); sent = true; } catch (e2) {}
  }
  if (sent) { S.outbox = S.outbox.slice(batch.length); save(); }
}
async function restoreIfEmpty() {
  if (!CFG.progressUrl || Object.keys(S.words).length) return;
  try {
    const r = await fetch(`${CFG.progressUrl}?action=state&key=${encodeURIComponent(CFG.key)}`);
    const j = await r.json();
    if (j && j.state && j.state.words) { S = Object.assign(blankState(), j.state, { outbox: [] }); save(); }
  } catch (e) {}
}

/* ---------- 聲音：唸英文 ---------- */
let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
  voice = vs.find(v => /google/i.test(v.name)) || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, slow) {
  if (!('speechSynthesis' in window)) return Promise.resolve();
  return new Promise(res => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (voice) u.voice = voice;
    u.rate = slow ? 0.6 : 0.88; u.pitch = 1.05;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
    setTimeout(res, 8000);
  });
}

/* ---------- 音效 ---------- */
let actx = null;
function tone(freqs, dur = .12, type = 'sine', gap = .1) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const t = actx.currentTime + i * gap;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .05);
    });
  } catch (e) {}
}
const sfx = {
  yay: () => tone([784, 988, 1319], .18, 'triangle', .09),
  soft: () => tone([392, 349], .16, 'sine', .12),
  tap: () => tone([660], .06, 'sine'),
  fanfare: () => tone([523, 659, 784, 1047, 784, 1047], .2, 'triangle', .12),
};

/* ---------- 聽陽寶說話：語音辨識 ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srOff = !SR;   // 不支援或被拒，就改成「跟著唸」
function listen() {
  return new Promise(res => {
    if (srOff) return res({ error: 'off' });
    let done = false, alts = [];
    const r = new SR();
    r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    r.onresult = e => { for (const result of e.results) for (const a of result) alts.push(a.transcript); };
    r.onerror = e => { if (['not-allowed', 'service-not-allowed', 'network', 'audio-capture'].includes(e.error)) { srOff = true; } finish({ error: e.error }); };
    r.onend = () => finish(alts.length ? { alts } : { error: 'no-speech' });

function speakBlock() {
  return `<div class="row" style="flex-direction:column;gap:8px">
    <button class="mic" id="mic" aria-label="按我開始說"><span class="emo">🎤</span></button>
    <div class="heard" id="heard">${srOff ? '跟著唸一次，唸完按「我唸好了」' : '按麥克風，對小羊說說看'}</div>
    <div class="stars-row" id="sstars"></div>
  </div>`;
}
function wireSpeak(card, step, target, kind) {
  const mic = card.querySelector('#mic'), heard = card.querySelector('#heard'), st = card.querySelector('#sstars');
  let tries = 0, best = 0;
  if (srOff) {
    mic.innerHTML = '<span class="emo">🙋</span>';
    mic.setAttribute('aria-label', '我唸好了');
    mic.onclick = () => { sfx.yay(); burstAt(mic); heard.textContent = '好勇敢！唸出來就是最棒的！'; logEvent({ type: 'speak', sid: ses.sid, id: step.w.id, w: step.w.w, kind, mode: 'self' }); };
    return;
  }
  mic.onclick = async () => {
    if (mic.classList.contains('listening')) return;
    mic.classList.add('listening'); heard.textContent = '小羊在聽……';
    const r = await listen();
    mic.classList.remove('listening');
    if (r.error) {
      if (srOff) { heard.textContent = '麥克風沒辦法用，我們改成跟著唸！'; wireSpeak(card, step, target, kind); return; }
      heard.textContent = r.error === 'no-speech' ? '沒聽到聲音耶，大聲一點點再試一次～' : '再按一次麥克風試試看～';
      return;
    }
    tries++;
    let ok, stars;
    if (kind === 'word') { ok = judgeWord(r.alts, target); stars = ok ? 3 : 0; }
    else { const sc = judgeSentence(r.alts, target); best = Math.max(best, sc); stars = sc >= .85 ? 3 : sc >= .6 ? 2 : sc >= .3 ? 1 : 0; ok = stars >= 2; }
    heard.innerHTML = `小羊聽到：<span class="en">${esc(r.alts[0] || '')}</span>`;
    st.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
    st.classList.add('emo');
    logEvent({ type: 'speak', sid: ses.sid, id: step.w.id, w: step.w.w, kind, ok, stars, tries, heard: r.alts[0] || '' });
    if (ok) {
      sfx.yay(); burstAt(mic, ['🎉', '⭐', '💖', '🎶']);
      heard.innerHTML += '<br><b>唸得好棒！</b>';
      if (tries === 1) gainStar();
    } else if (tries >= 3) {
      sfx.soft();
      heard.innerHTML += '<br><b>好棒，你很努力！我們下次再挑戰～</b>';
    } else {
      sfx.soft();
      heard.innerHTML += '<br>再聽一次 🔊，然後再唸一次！';
    }
  };
}

function distractors(w, n, field) {
  const near = W.filter(x => x.id !== w.id && x[field] !== w[field] && x.w.toLowerCase() !== w.w.toLowerCase());
  const same = shuffle(near.filter(x => Math.abs(x.u - w.u) <= 4));
  const far = shuffle(near);
  const out = [], seen = new Set([w[field]]);
  for (const x of same.concat(far)) { if (!seen.has(x[field])) { seen.add(x[field]); out.push(x[field]); } if (out.length >= n) break; }
  return out;
}

function choiceQuiz(step, { prompt, tag, body, options, answer, cls = '', after }) {
  const card = frame(`
    <div class="prompt"><span class="tag">${tag}</span> ${prompt}</div>
    ${body}
    <div class="choices ${options.some(o => o.length > 18) ? 'one' : ''}"></div>
    <div class="heard" id="msg"></div>
  `);
  const box = card.querySelector('.choices'), msg = card.querySelector('#msg');
  let tries = 0, done = false;
  for (const o of shuffle(options)) {
    const b = h(`<button class="choice ${cls} ${o.length > 18 ? 'long' : ''}">${esc(o)}</button>`);
    b.onclick = () => {
      if (done) return;
      tries++;
      if (o === answer) {
        done = true; b.classList.add('right'); sfx.yay(); burstAt(b);
        msg.innerHTML = `<b>${pick(CHEERS)}</b>`;
        if (tries === 1) gainStar(); else markMiss(step.w);
        answerLog(step, tries === 1, tries);
        if (after) after(card);
        nextBtn(card);
      } else {
        sfx.soft(); wiggle(b); b.classList.add('tried');
        msg.textContent = pick(SOFTS);
        if (tries >= 2) { [...box.children].find(x => x.textContent === answer).classList.add('glow'); msg.textContent = '答案在發亮的地方喔！'; }
      }
    };
    box.appendChild(b);
  }
  return card;
}

function viewSpell(step) {
  const w = step.w, word = w.w.toLowerCase(), L = word.length;
  const extra = 'aeioulnrst'.split('').filter(c => !word.includes(c));
  const letters = shuffle(word.split('').concat(shuffle(extra).slice(0, L > 7 ? 1 : 2)));
  const card = frame(`
    <div class="prompt"><span class="tag">拼拼看</span> 聽發音，把字拼出來</div>
    <div class="emoji-big">${w.e}</div>
    <div class="gloss">${esc(w.g)}</div>
    <div class="row">
      <button class="icon-btn" id="sp" aria-label="聽發音"><span class="emo">🔊</span></button>
      <button class="icon-btn" id="slow" aria-label="慢慢唸"><span class="emo">🐢</span></button>
    </div>
    <div class="slots">${word.split('').map(() => '<div class="slot"></div>').join('')}</div>
    <div class="tiles">${letters.map((c, i) => `<button class="tile" data-i="${i}">${c}</button>`).join('')}</div>
    <div class="row"><button class="btn soft small" id="clear">重來</button></div>
    <div class="heard" id="msg"></div>
  `);
  const slots = [...card.querySelectorAll('.slot')], tiles = [...card.querySelectorAll('.tile')], msg = card.querySelector('#msg');
  const fill = new Array(L).fill(null);    // 每格放的 tile 索引
  const locked = new Array(L).fill(false);
  let tries = 0, done = false;
  card.querySelector('#sp').onclick = () => say(w.w);
  card.querySelector('#slow').onclick = () => say(w.w, true);
  function render() {
    slots.forEach((s, k) => {
      s.textContent = fill[k] == null ? '' : letters[fill[k]];
      s.classList.toggle('filled', fill[k] != null && !locked[k]);
      s.classList.toggle('locked', locked[k]);
    });
    tiles.forEach((t, i) => t.classList.toggle('used', fill.includes(i)));
  }
  function lockLetters(n) {   // 提示：從頭開始幫忙放好 n 個字母
    clearFree();
    for (let k = 0; k < n; k++) {
      if (locked[k]) continue;
      const i = letters.findIndex((c, idx) => c === word[k] && !fill.includes(idx));
      fill[k] = i; locked[k] = true;
    }
    render();
  }
  function clearFree() { fill.forEach((v, k) => { if (!locked[k]) fill[k] = null; }); }
  tiles.forEach(t => t.onclick = () => {
    if (done) return;
    const k = fill.findIndex(v => v == null); if (k < 0) return;
    sfx.tap(); fill[k] = Number(t.dataset.i); render();
    if (fill.every(v => v != null)) check();
  });
  slots.forEach((s, k) => s.onclick = () => { if (done || locked[k] || fill[k] == null) return; fill[k] = null; render(); });
  card.querySelector('#clear').onclick = () => { if (done) return; clearFree(); render(); };
  function check() {
    const got = fill.map(i => letters[i]).join('');
    tries++;
    if (got === word) {
      done = true; sfx.yay(); burstAt(slots[Math.floor(L / 2)]);
      msg.innerHTML = `<b>${pick(CHEERS)}</b>`;
      if (tries === 1) gainStar(); else markMiss(w);
      answerLog(step, tries === 1, tries, { got });
      say(w.w); nextBtn(card);
      return;
    }
    sfx.soft(); wiggle(card.querySelector('.slots'));
    logEvent({ type: 'spellTry', sid: ses.sid, id: w.id, w: w.w, got });
    if (tries === 1) { msg.textContent = '差一點點！小羊幫你放好第一個字母～'; setTimeout(() => lockLetters(1), 450); }
    else if (tries === 2) { msg.textContent = '再幫你放好一半，加油！'; setTimeout(() => lockLetters(Math.max(2, Math.ceil(L / 2))), 450); }
    else {
      done = true; markMiss(w);
      setTimeout(() => { lockLetters(L); msg.innerHTML = '<b>我們一起記住它！</b>念一遍：<span class="en">' + esc(w.w) + '</span>'; say(w.w, true); }, 450);
      answerLog(step, false, tries, { got });
      nextBtn(card);
    }
  }
  setTimeout(() => say(w.w), 300);
}

function viewOrder(step) {
  const w = step.w, toks = w.s.split(' ');
  let order = shuffle(toks.map((_, i) => i));
  if (order.every((v, i) => v === i) && toks.length > 1) order = order.reverse();
  const card = frame(`
    <div class="prompt"><span class="tag">排句子</span> 把句子排回來</div>
    <div class="zh">${esc(w.z)}</div>
    <div class="answer-line" id="line"></div>
    <div class="row" id="pool">${order.map(i => `<button class="chip" data-i="${i}">${esc(toks[i])}</button>`).join('')}</div>
    <div class="row"><button class="icon-btn" id="sp" aria-label="聽例句"><span class="emo">🔊</span></button></div>
    <div class="heard" id="msg"></div>
  `);
  const line = card.querySelector('#line'), pool = card.querySelector('#pool'), msg = card.querySelector('#msg');
  const placed = []; let tries = 0, done = false, keep = 0;
  card.querySelector('#sp').onclick = () => say(w.s);
  function render() {
    line.innerHTML = '';
    placed.forEach((i, k) => {
      const c = h(`<button class="chip placed">${esc(toks[i])}</button>`);
      c.onclick = () => { if (done || k < keep) return; placed.splice(k, 1); render(); };
      line.appendChild(c);
    });
    pool.querySelectorAll('.chip').forEach(c => c.classList.toggle('used', placed.includes(Number(c.dataset.i))));
  }
  pool.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    if (done) return; const i = Number(c.dataset.i); if (placed.includes(i)) return;
    sfx.tap(); placed.push(i); render();
    if (placed.length === toks.length) check();
  });
  function check() {
    tries++;
    const got = placed.map(i => toks[i]);
    const ok = got.every((t, k) => t === toks[k]);
    if (ok) {
      done = true; sfx.yay(); burstAt(line);
      msg.innerHTML = `<b>${pick(CHEERS)}</b>`;
      if (tries === 1) gainStar(); else markMiss(w);
      answerLog(step, tries === 1, tries);
      say(w.s); nextBtn(card); return;
    }
    sfx.soft(); wiggle(line);
    // 保留前面排對的部分
    let k = 0; while (k < got.length && got[k] === toks[k]) k++;
    if (tries >= 2) {
      done = true; markMiss(w);
      placed.length = 0; toks.forEach((_, i) => placed.push(i)); keep = toks.length; render();
      msg.innerHTML = '<b>答案是這樣排喔！</b>我們聽一次 🔊';
      answerLog(step, false, tries); say(w.s); nextBtn(card); return;
    }
    keep = Math.max(k, 1);
    // 第一個字一定幫忙放好
    if (k === 0) { placed.length = 0; placed.push(toks.findIndex((_, i) => i === 0)); }
    else placed.length = k;
    msg.textContent = k ? `前面 ${k} 個排對了！後面再試試看～` : '小羊幫你放好第一個字，再試試看～';
    setTimeout(render, 400);
  }
}

/* ---------- 結束與存檔 ---------- */
function finish() {
  clearInterval(timerId);
  const s = ses; ses = null;
  if (!s) return home();
  const t = today();
  const learned = [];
  for (const [id, r] of Object.entries(s.res)) {
    const old = S.words[id];
    if (!r.review) {
      if (!r.shown) continue;                       // 時間到還沒見到的新字，下次再學
      const box = r.quizzed && r.first ? 2 : 1;     // 只看過沒考到的，明天就複習
      S.words[id] = { box, due: addDays(INTERVAL[box]), seen: 1, miss: r.first ? 0 : 1, first: t };
      learned.push(id);
    } else if (old && r.quizzed) {
      const box = r.first ? Math.min(6, old.box + 1) : 1;
      S.words[id] = Object.assign(old, { box, due: addDays(INTERVAL[box]), seen: (old.seen || 0) + 1, miss: (old.miss || 0) + (r.first ? 0 : 1) });
    }
  }
  const newBadges = [];
  for (const u of UNITS) if (!S.badges.includes(u) && unitLeft(u).length === 0) { S.badges.push(u); newBadges.push(u); }
  if (!S.days.includes(t)) S.days.push(t);
  const minutes = Math.round(s.elapsed / 60000);
  logEvent({ type: 'session', sid: s.sid, minutes, stars: s.stars, newIds: learned, reviewIds: s.reviewIds, badges: newBadges });
  save(); flush();

  $app.innerHTML = '';
  const card = h(`<section class="card">
    <div class="hero">${lamb('cheer')}<h1>今天好棒，${NAME}！</h1></div>
    <div class="result-stats">
      <div class="stat"><b>${s.stars}</b>得到星星</div>
      <div class="stat"><b>${learned.length}</b>新朋友</div>
      <div class="stat"><b>${s.reviewIds.length}</b>複習</div>
      <div class="stat"><b>${minutes}</b>分鐘</div>
    </div>
    ${learned.length ? `<div class="learned">${learned.map(id => `<span><i class="emo">${BY_ID[id].e}</i> ${esc(BY_ID[id].w)}</span>`).join('')}</div>` : ''}
    ${lateShownOn === t ? `<div class="buddy">${tiger('happy')}<div class="bubble">這才乖！明天早一點練喔～</div></div>` : ''}
    ${newBadges.length ? `<div>${buddy(`拿到新貼紙：${newBadges.map(u => `<span class="emo" style="font-size:36px">${unitWords(u)[0].e}</span> <b class="en">NCL4-${u}</b>`).join('、')}`, 'wow')}</div>` : ''}
    <button class="btn big" id="ok">明天見！<span class="emo">👋</span></button>
  </section>`);
  $app.appendChild(card);
  card.querySelector('#ok').onclick = () => { sfx.tap(); home(); };
  sfx.fanfare(); setTimeout(() => burst(innerWidth / 2, innerHeight / 3, ['🎉', '⭐', '💖', '🦦', '🌟', '🎈']), 150);
}

/* ---------- 首頁、單元、貼紙簿 ---------- */
function home() {
  ses = null; clearInterval(timerId);
  const due = dueList().length;
  const u = nextUnit(S.curUnit);
  const left = u == null ? 0 : unitLeft(u).length;
  const hour = new Date().getHours();
  const hi = hour < 11 ? '早安' : hour < 18 ? '午安' : '晚安';
  $app.innerHTML = '';
  const card = h(`<section class="card">
    <div class="hero">${lamb('smile')}<h1>${hi}，${NAME}！</h1>
      <div style="color:var(--ink-soft)">今天也一起玩 15 分鐘英文吧</div></div>
    <div class="plan">
      <div class="plan-item"><span class="emo">🔁</span><div><b>${due ? `複習 ${Math.min(due, MAX_REVIEW)} 個字` : '今天沒有要複習的字'}</b><span>${due ? '以前學過、今天要再見一次的字' : '很棒，先學新字！'}</span></div></div>
      <div class="plan-item"><span class="emo">🌱</span><div><b>${u == null ? '全部學完了！' : `新單元 <span class="en">NCL4-${u}</span>`}</b><span>${u == null ? '多複習就好' : `還有 ${left} 個新字`}</span></div></div>
    </div>
    <button class="btn big" id="go">開始練習 <span class="emo">🚀</span></button>
    <div class="home-actions">
      <button class="btn soft small" id="units"><span class="emo">🗺️</span> 換單元</button>
      <button class="btn soft small" id="book"><span class="emo">📒</span> 貼紙簿 ${S.badges.length}/${UNITS.length}</button>
    </div>
    <div class="meta-row"><span><i class="emo">⭐</i> 星星 ${S.stars}</span><span><i class="emo">📅</i> 練習了 ${S.days.length} 天</span><span><i class="emo">📚</i> 學過 ${Object.keys(S.words).length} / ${W.length} 個字</span></div>
    ${srOff ? '<div class="heard">這台裝置不能用語音辨識，說話練習會改成「跟著唸」。</div>' : ''}
  </section>`);
  $app.appendChild(card);
  card.querySelector('#go').onclick = () => { pickVoice(); startSession(); };
  card.querySelector('#units').onclick = () => { sfx.tap(); unitsView(); };
  card.querySelector('#book').onclick = () => { sfx.tap(); bookView(); };
  flush();
  // 8 點後還沒練：一打開就吼；停在首頁跨過 8 點也會吼
  if (isLate()) showLateTiger();
  clearInterval(homeTimer);
  homeTimer = setInterval(() => { if (!ses && isLate() && lateShownOn !== today()) showLateTiger(); }, 30000);
}
let homeTimer = null;

function backBar(title) {
  const top = h(`<div class="topbar"><button class="icon-btn" id="back" aria-label="回首頁"><span class="emo">🏠</span></button><h2 style="margin:0;font-size:28px">${title}</h2></div>`);
  top.querySelector('#back').onclick = () => { sfx.tap(); home(); };
  return top;
}
function unitsView() {
  $app.innerHTML = '';
  $app.appendChild(backBar('選一個單元'));
  const cur = nextUnit(S.curUnit);
  const card = h(`<section class="card"><div class="heard">點一下，下次練習就從這個單元開始學新字</div><div class="grid"></div></section>`);
  const g = card.querySelector('.grid');
  for (const u of UNITS) {
    const all = unitWords(u).length, done = all - unitLeft(u).length;
    const b = h(`<button class="unit ${u === cur ? 'cur' : ''} ${done === all ? 'done' : ''}">
      <span class="emo" style="font-size:30px">${unitWords(u)[0].e}</span><span class="num">${u}</span><span class="sub">${done}/${all}</span></button>`);
    b.onclick = () => { if (done === all) { wiggle(b); return; } sfx.tap(); S.curUnit = u; save(); home(); };
    g.appendChild(b);
  }
  $app.appendChild(card);
}
function bookView() {
  $app.innerHTML = '';
  $app.appendChild(backBar('貼紙簿'));
  const card = h(`<section class="card">${buddy(`學完一個單元就能貼一張貼紙！已經有 <b>${S.badges.length}</b> 張囉。`, 'smile')}<div class="grid"></div></section>`);
  const g = card.querySelector('.grid');
  for (const u of UNITS) {
    g.appendChild(S.badges.includes(u)
      ? h(`<div class="sticker">${unitWords(u)[0].e}<small>${u}</small></div>`)
      : h(`<div class="sticker empty">${u}</div>`));
  }
  $app.appendChild(card);
}

/* ---------- 開始 ---------- */
restoreIfEmpty().then(() => {
  home();
  // 大人試看用：網址加 #tiger 或 #idle
  if (location.hash === '#tiger') showLateTiger();
  if (location.hash === '#idle') setTimeout(showIdleTiger, 300);
});
window.addEventListener('online', flush);
</script>
